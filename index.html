  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>小紅冒險 Red's Adventure</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-touch-callout: none;
      -webkit-user-select: none;
      user-select: none;
    }
    html, body {
      width: 100%;
      height: 100%;
      background-color: #05070a;
      overflow: hidden;
      touch-action: none;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
    }
    #game-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      background-color: #05070a;
    }
    canvas {
      display: block;
      image-rendering: -moz-crisp-edges;
      image-rendering: -webkit-crisp-edges;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
    }
    #rotate-hint {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(5, 7, 10, 0.96);
      color: #fff;
      display: none;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 9999;
      font-size: 19px;
      text-align: center;
      padding: 24px;
    }
    #rotate-hint svg {
      width: 68px;
      height: 68px;
      fill: #ff4757;
      margin-bottom: 20px;
      animation: rotate-phone 1.8s infinite ease-in-out;
    }
    @keyframes rotate-phone {
      0%, 15% { transform: rotate(0deg); }
      50%, 65% { transform: rotate(90deg); }
      100% { transform: rotate(0deg); }
    }
  </style>
</head>

    // ==========================================
    // 1. WebAudio 合成音效系統 (Audio)
    // ==========================================
    const Audio = {
      ctx: null,
      muted: false,
      init() {
        if (!this.ctx) {
          const AudioContext = window.AudioContext || window.webkitAudioContext;
          if (AudioContext) {
            this.ctx = new AudioContext();
          }
        }
        if (this.ctx && this.ctx.state === 'suspended') {
          this.ctx.resume();
        }
      },
      toggleMute() {
        this.muted = !this.muted;
        return this.muted;
      },
      playTone(freqStart, freqEnd, type, duration, vol = 0.15) {
        if (this.muted) return;
        this.init();
        if (!this.ctx) return;
        try {
          const now = this.ctx.currentTime;
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();

          osc.type = type;
          osc.frequency.setValueAtTime(freqStart, now);
          if (freqEnd !== null && freqEnd !== freqStart) {
            osc.frequency.exponentialRampToValueAtTime(Math.max(freqEnd, 20), now + duration);
          }

          gain.gain.setValueAtTime(vol, now);
          gain.gain.exponentialRampToValueAtTime(0.0001, now + duration);

          osc.connect(gain);
          gain.connect(this.ctx.destination);

          osc.start(now);
          osc.stop(now + duration);
        } catch (e) {}
      },
      jump() {
        this.playTone(160, 480, 'square', 0.14, 0.12);
      },
      coin() {
        if (this.muted) return;
        this.init();
        if (!this.ctx) return;
        try {
          const now = this.ctx.currentTime;
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'square';
          osc.frequency.setValueAtTime(987.77, now);
          osc.frequency.setValueAtTime(1318.51, now + 0.08);
          gain.gain.setValueAtTime(0.12, now);
          gain.gain.setValueAtTime(0.12, now + 0.08);
          gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.3);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start(now);
          osc.stop(now + 0.3);
        } catch (e) {}
      },
      stomp() {
        this.playTone(240, 80, 'triangle', 0.12, 0.2);
      },
      hit() {
        this.playTone(400, 100, 'sawtooth', 0.18, 0.22);
      },
      powerup() {
        if (this.muted) return;
        this.init();
        if (!this.ctx) return;
        try {
          const now = this.ctx.currentTime;
          const notes = [330, 392, 659, 523, 587, 784];
          const step = 0.045;
          for (let i = 0; i < notes.length; i++) {
            const osc = this.ctx.createOscillator();
            const gain = this.ctx.createGain();
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(notes[i], now + i * step);
            gain.gain.setValueAtTime(0.14, now + i * step);
            gain.gain.exponentialRampToValueAtTime(0.0001, now + (i + 1) * step);
            osc.connect(gain);
            gain.connect(this.ctx.destination);
            osc.start(now + i * step);
            osc.stop(now + (i + 1) * step);
          }
        } catch (e) {}
      },
      dead() {
        this.playTone(320, 50, 'sawtooth', 0.45, 0.25);
      },
      win() {
        if (this.muted) return;
        this.init();
        if (!this.ctx) return;
        try {
          const now = this.ctx.currentTime;
          const melody = [523, 659, 784, 1046];
          const dur = 0.12;
          for (let i = 0; i < melody.length; i++) {
            const osc = this.ctx.createOscillator();
            const gain = this.ctx.createGain();
            osc.type = 'square';
            osc.frequency.setValueAtTime(melody[i], now + i * dur);
            gain.gain.setValueAtTime(0.14, now + i * dur);
            gain.gain.exponentialRampToValueAtTime(0.0001, now + (i + 1) * dur);
            osc.connect(gain);
            gain.connect(this.ctx.destination);
            osc.start(now + i * dur);
            osc.stop(now + (i + 1) * dur);
          }
        } catch (e) {}
      },
      button() {
        this.playTone(600, 400, 'sine', 0.06, 0.08);
      }
    };

    // ==========================================
    // 2. 預渲染離屏畫布快取 (Render Sprites)
    // ==========================================
    const SpriteSheets = {};
    function precompileSprites() {
      for (const name in SPRITE_DEFS) {
        const rows = SPRITE_DEFS[name];
        const h = rows.length;
        const w = rows[0].length;
        const offCanvas = document.createElement('canvas');
        offCanvas.width = w;
        offCanvas.height = h;
        const offCtx = offCanvas.getContext('2d');

        for (let y = 0; y < h; y++) {
          const rowStr = rows[y];
          for (let x = 0; x < w; x++) {
            const char = rowStr[x];
            if (char !== '.' && PALETTE[char]) {
              offCtx.fillStyle = PALETTE[char];
              offCtx.fillRect(x, y, 1, 1);
            }
          }
        }
        SpriteSheets[name] = offCanvas;
      }
    }
    precompileSprites();

    // ==========================================
    // 3. 多點觸控與輸入系統 (Input)
    // ==========================================
    const Input = {
      // 綜合狀態（鍵盤與觸控聯集）
      left: false,
      right: false,
      jump: false,
      run: false,
      jumpPressed: false,
      pausePressed: false,
      screenTapped: false, // 支援點擊任意螢幕處開始
      _jumpLast: false,

      // 獨立鍵盤狀態
      keyLeft: false,
      keyRight: false,
      keyJump: false,
      keyRun: false,

      // 獨立觸控狀態
      touchLeft: false,
      touchRight: false,
      touchJump: false,
      touchRun: false,

      // 觸控點物件池（零每幀物件配置）
      touchSlots: [],

      areas: {
        dpadLeft:  { x: 15,  y: 185, w: 60, h: 65 },
        dpadRight: { x: 85,  y: 185, w: 60, h: 65 },
        btnRun:    { x: 335, y: 195, w: 55, h: 55 },
        btnJump:   { x: 405, y: 185, w: 60, h: 65 },
        btnPause:  { x: 440, y: 10,  w: 30, h: 30 },
        btnMute:   { x: 400, y: 10,  w: 30, h: 30 }
      },

      init(canvas) {
        // 預配置 10 個觸控插槽
        for (let i = 0; i < 10; i++) {
          this.touchSlots.push({ id: -1, x: 0, y: 0, active: false });
        }

        window.addEventListener('keydown', (e) => this.onKey(e, true));
        window.addEventListener('keyup', (e) => this.onKey(e, false));

        canvas.addEventListener('pointerdown', (e) => this.onPointer(e, 'down', canvas));
        canvas.addEventListener('pointermove', (e) => this.onPointer(e, 'move', canvas));
        canvas.addEventListener('pointerup', (e) => this.onPointer(e, 'up', canvas));
        canvas.addEventListener('pointercancel', (e) => this.onPointer(e, 'up', canvas));
      },

      reset() {
        this.keyLeft = this.keyRight = this.keyJump = this.keyRun = false;
        this.touchLeft = this.touchRight = this.touchJump = this.touchRun = false;
        this.left = this.right = this.jump = this.run = false;
        this.jumpPressed = false;
        this.pausePressed = false;
        this.screenTapped = false;
        this._jumpLast = false;
        for (let i = 0; i < this.touchSlots.length; i++) {
          this.touchSlots[i].active = false;
          this.touchSlots[i].id = -1;
        }
      },

      onKey(e, isDown) {
        Audio.init();
        switch (e.code) {
          case 'ArrowLeft':
          case 'KeyA':
            this.keyLeft = isDown;
            e.preventDefault();
            break;
          case 'ArrowRight':
          case 'KeyD':
            this.keyRight = isDown;
            e.preventDefault();
            break;
          case 'Space':
          case 'KeyW':
          case 'ArrowUp':
            this.keyJump = isDown;
            e.preventDefault();
            break;
          case 'ShiftLeft':
          case 'ShiftRight':
          case 'KeyJ':
            this.keyRun = isDown;
            e.preventDefault();
            break;
          case 'KeyP':
          case 'Escape':
            if (isDown) this.pausePressed = true;
            e.preventDefault();
            break;
          case 'KeyM':
            if (isDown) Audio.toggleMute();
            e.preventDefault();
            break;
        }
        this.combineInputs();
      },

      onPointer(e, type, canvas) {
        Audio.init();
        const rect = canvas.getBoundingClientRect();
        const scale = rect.width / VIEW_W;
        const x = (e.clientX - rect.left) / scale;
        const y = (e.clientY - rect.top) / scale;

        if (type === 'down') {
          // 右上功能鈕判斷
          if (this.inRect(x, y, this.areas.btnPause)) {
            this.pausePressed = true;
            Audio.button();
            return;
          }
          if (this.inRect(x, y, this.areas.btnMute)) {
            Audio.toggleMute();
            return;
          }

          this.screenTapped = true;

          // 尋找空插槽放入觸控點
          for (let i = 0; i < this.touchSlots.length; i++) {
            const slot = this.touchSlots[i];
            if (!slot.active) {
              slot.id = e.pointerId;
              slot.x = x;
              slot.y = y;
              slot.active = true;
              break;
            }
          }
        } else if (type === 'move') {
          // 原地更新既有插槽座標，不產生任何物件 (Zero Allocation)
          for (let i = 0; i < this.touchSlots.length; i++) {
            const slot = this.touchSlots[i];
            if (slot.active && slot.id === e.pointerId) {
              slot.x = x;
              slot.y = y;
              break;
            }
          }
        } else if (type === 'up') {
          for (let i = 0; i < this.touchSlots.length; i++) {
            const slot = this.touchSlots[i];
            if (slot.active && slot.id === e.pointerId) {
              slot.active = false;
              slot.id = -1;
              break;
            }
          }
        }

        this.syncTouches();
      },

      syncTouches() {
        let tl = false, tr = false, tj = false, trn = false;
        for (let i = 0; i < this.touchSlots.length; i++) {
          const s = this.touchSlots[i];
          if (s.active) {
            if (this.inRect(s.x, s.y, this.areas.dpadLeft))  tl = true;
            if (this.inRect(s.x, s.y, this.areas.dpadRight)) tr = true;
            if (this.inRect(s.x, s.y, this.areas.btnJump))   tj = true;
            if (this.inRect(s.x, s.y, this.areas.btnRun))    trn = true;
          }
        }
        this.touchLeft = tl;
        this.touchRight = tr;
        this.touchJump = tj;
        this.touchRun = trn;
        this.combineInputs();
      },

      combineInputs() {
        this.left = this.keyLeft || this.touchLeft;
        this.right = this.keyRight || this.touchRight;
        this.jump = this.keyJump || this.touchJump;
        this.run = this.keyRun || this.touchRun;
      },

      inRect(px, py, r) {
        return px >= r.x && px <= r.x + r.w && py >= r.y && py <= r.y + r.h;
      },

      update() {
        if (this.jump && !this._jumpLast) {
          this.jumpPressed = true;
        } else {
          this.jumpPressed = false;
        }
        this._jumpLast = this.jump;
      }
    };

    const Level = {
      currentLevelIndex: 0,
      widthInTiles: 0,
      heightInTiles: 17,
      tiles: [],
      cameraX: 0,
      flagX: 0,
      theme: 'overworld',
      skyColor: '#5c94fc',

      load(index) {
        this.currentLevelIndex = index % RAW_LEVELS.length;
        const levelData = RAW_LEVELS[this.currentLevelIndex];
        const raw = levelData.data;
        this.theme = levelData.theme;
        this.skyColor = levelData.sky;
        this.heightInTiles = raw.length;
        this.widthInTiles = raw[0].length;
        this.tiles = [];

        Entities.clearAll();

        for (let y = 0; y < this.heightInTiles; y++) {
          const row = [];
          for (let x = 0; x < this.widthInTiles; x++) {
            const ch = raw[y][x];
            let tile = 0; // 空氣
            if (ch === 'G') tile = 1; // 地面
            else if (ch === 'B') tile = 2; // 磚塊
            else if (ch === '?' || ch === 'Q') tile = 3; // 問號方塊
            else if (ch === 'T') tile = 4; // 水管頂
            else if (ch === 'P') tile = 5; // 水管身
            else if (ch === 'F') {
              tile = 6; // 旗桿
              this.flagX = x * TILE_SIZE;
            } else if (ch === 'E') tile = 7; // 空問號方塊
            else if (ch === 'C') {
              tile = 0; // 地圖金幣視為空氣但生成收集物實體
              Entities.spawnCoin(x * TILE_SIZE, y * TILE_SIZE);
            }

            if (ch === '@') {
              Player.spawn(x * TILE_SIZE, y * TILE_SIZE);
            } else if (ch === 'M') {
              Entities.spawnEnemy('shroom', x * TILE_SIZE, y * TILE_SIZE);
            } else if (ch === 'S') {
              Entities.spawnEnemy('turtle', x * TILE_SIZE, y * TILE_SIZE);
            }
            row.push(tile);
          }
          this.tiles.push(row);
        }

        // 關卡 2 與 3 加入移動浮島平台
        if (this.currentLevelIndex === 1) {
          Entities.spawnPlatform(400, 185, 75, 1);
          Entities.spawnPlatform(780, 165, 90, -1);
        } else if (this.currentLevelIndex === 2) {
          Entities.spawnPlatform(330, 180, 65, 1);
          Entities.spawnPlatform(610, 150, 85, -1);
          Entities.spawnPlatform(940, 175, 75, 1);
        }

        this.cameraX = 0;
      },

      getTile(tx, ty) {
        if (tx < 0 || tx >= this.widthInTiles || ty < 0 || ty >= this.heightInTiles) {
          return 0;
        }
        return this.tiles[ty][tx];
      },

      setTile(tx, ty, val) {
        if (tx >= 0 && tx < this.widthInTiles && ty >= 0 && ty < this.heightInTiles) {
          this.tiles[ty][tx] = val;
        }
      },

      updateCamera(targetX) {
        const targetCamX = targetX - VIEW_W * 0.38;
        this.cameraX += (targetCamX - this.cameraX) * 0.12;
        const maxCamX = this.widthInTiles * TILE_SIZE - VIEW_W;
        if (this.cameraX < 0) this.cameraX = 0;
        if (this.cameraX > maxCamX) this.cameraX = maxCamX;
      }
    };

    // ==========================================
    // 5. 物件池與特效實體管理 (Entities)
    // ==========================================
    const Entities = {
      enemies: [],
      items: [],
      coins: [],
      bouncingBlocks: [],
      platforms: [],
      particles: [],
      floatingScores: [],

      init() {
        // 預配置固定物件池，Hot Loop 零物件配置 (Zero Allocation)
        for (let i = 0; i < 30; i++) {
          this.enemies.push({ active: false, type: '', x: 0, y: 0, vx: 0, vy: 0, w: 14, h: 15, state: 'walk', timer: 0 });
        }
        for (let i = 0; i < 15; i++) {
          this.items.push({ active: false, type: '', x: 0, y: 0, vx: 0, vy: 0, w: 14, h: 14 });
        }
        for (let i = 0; i < 30; i++) {
          this.coins.push({ active: false, x: 0, y: 0, w: 12, h: 14, isBouncing: false, vy: 0, life: 0 });
        }
        for (let i = 0; i < 10; i++) {
          this.bouncingBlocks.push({ active: false, tx: 0, ty: 0, tile: 0, offset: 0, dir: -1 });
        }
        for (let i = 0; i < 6; i++) {
          this.platforms.push({ active: false, x: 0, y: 0, startX: 0, range: 0, dir: 1, speed: 0.8, w: 32, h: 8, vx: 0 });
        }
        for (let i = 0; i < 80; i++) {
          this.particles.push({ active: false, x: 0, y: 0, vx: 0, vy: 0, color: '#fff', life: 0, size: 2 });
        }
        for (let i = 0; i < 20; i++) {
          this.floatingScores.push({ active: false, x: 0, y: 0, text: '', life: 0 });
        }
      },

      clearAll() {
        for (let i = 0; i < this.enemies.length; i++) this.enemies[i].active = false;
        for (let i = 0; i < this.items.length; i++) this.items[i].active = false;
        for (let i = 0; i < this.coins.length; i++) this.coins[i].active = false;
        for (let i = 0; i < this.bouncingBlocks.length; i++) this.bouncingBlocks[i].active = false;
        for (let i = 0; i < this.platforms.length; i++) this.platforms[i].active = false;
        for (let i = 0; i < this.particles.length; i++) this.particles[i].active = false;
        for (let i = 0; i < this.floatingScores.length; i++) this.floatingScores[i].active = false;
      },

      spawnEnemy(type, x, y) {
        for (let i = 0; i < this.enemies.length; i++) {
          const e = this.enemies[i];
          if (!e.active) {
            e.active = true;
            e.type = type;
            e.x = x;
            e.y = y;
            e.vx = -0.6;
            e.vy = 0;
            e.w = 14;
            e.h = 15;
            e.state = 'walk';
            e.timer = 0;
            break;
          }
        }
      },

      spawnItem(type, x, y) {
        for (let i = 0; i < this.items.length; i++) {
          const it = this.items[i];
          if (!it.active) {
            it.active = true;
            it.type = type;
            it.x = x;
            it.y = y;
            it.vx = (type === 'mushroom') ? 0.8 : 0;
            it.vy = -3;
            it.w = 14;
            it.h = 14;
            break;
          }
        }
      },

      spawnCoin(x, y) {
        for (let i = 0; i < this.coins.length; i++) {
          const c = this.coins[i];
          if (!c.active) {
            c.active = true;
            c.x = x;
            c.y = y;
            c.w = 12;
            c.h = 14;
            c.isBouncing = false;
            c.vy = 0;
            c.life = 0;
            break;
          }
        }
      },

      spawnBounceCoin(x, y) {
        for (let i = 0; i < this.coins.length; i++) {
          const c = this.coins[i];
          if (!c.active) {
            c.active = true;
            c.x = x;
            c.y = y;
            c.w = 12;
            c.h = 14;
            c.isBouncing = true;
            c.vy = -4.5;
            c.life = 30;
            break;
          }
        }
      },

      triggerBounceBlock(tx, ty, tile) {
        for (let i = 0; i < this.bouncingBlocks.length; i++) {
          const b = this.bouncingBlocks[i];
          if (!b.active) {
            b.active = true;
            b.tx = tx;
            b.ty = ty;
            b.tile = tile;
            b.offset = 0;
            b.dir = -1;
            break;
          }
        }
      },

      spawnPlatform(x, y, range, dir) {
        for (let i = 0; i < this.platforms.length; i++) {
          const p = this.platforms[i];
          if (!p.active) {
            p.active = true;
            p.x = x;
            p.y = y;
            p.startX = x;
            p.range = range;
            p.dir = dir;
            p.speed = 0.8;
            p.w = 32;
            p.h = 8;
            p.vx = dir * p.speed;
            break;
          }
        }
      },

      addScoreText(txt, x, y) {
        for (let i = 0; i < this.floatingScores.length; i++) {
          const f = this.floatingScores[i];
          if (!f.active) {
            f.active = true;
            f.text = txt;
            f.x = x;
            f.y = y;
            f.life = 35;
            break;
          }
        }
      },

      emitBlockDebris(bx, by) {
        const colors = Level.theme === 'underground' ? ['#2c3e50', '#34495e', '#7f8c8d'] : ['#c0392b', '#795548', '#e67e22'];
        for (let i = 0; i < 4; i++) {
          for (let j = 0; j < this.particles.length; j++) {
            const p = this.particles[j];
            if (!p.active) {
              p.active = true;
              p.x = bx + (i % 2) * 8;
              p.y = by + Math.floor(i / 2) * 8;
              p.vx = (i % 2 === 0 ? -1.8 : 1.8) + (Math.random() - 0.5);
              p.vy = -4.2 - Math.random() * 2;
              p.color = colors[i % colors.length];
              p.life = 40;
              p.size = 3;
              break;
            }
          }
        }
      },

      update() {
        // 更新方塊彈跳動畫
        for (let i = 0; i < this.bouncingBlocks.length; i++) {
          const b = this.bouncingBlocks[i];
          if (b.active) {
            b.offset += b.dir * 1.5;
            if (b.offset <= -6) {
              b.dir = 1;
            } else if (b.offset >= 0 && b.dir === 1) {
              b.active = false;
              b.offset = 0;
            }
          }
        }

        // 更新移動平台
        for (let i = 0; i < this.platforms.length; i++) {
          const p = this.platforms[i];
          if (p.active) {
            p.x += p.dir * p.speed;
            p.vx = p.dir * p.speed;
            if (p.x > p.startX + p.range) {
              p.x = p.startX + p.range;
              p.dir = -1;
            } else if (p.x < p.startX - p.range) {
              p.x = p.startX - p.range;
              p.dir = 1;
            }
          }
        }

        // 更新敵人（具備遇牆及懸崖轉向 AI）
        for (let i = 0; i < this.enemies.length; i++) {
          const e = this.enemies[i];
          if (e.active) {
            e.vy = Math.min(e.vy + 0.35, 7);

            if (e.state === 'walk') {
              // 懸崖檢驗（當站在地面上時，檢查前腳下方一格是否為空）
              if (Math.abs(e.vy) < 0.05) {
                const aheadX = e.vx > 0 ? e.x + e.w + 2 : e.x - 2;
                const bottomTileY = Math.floor((e.y + e.h + 2) / TILE_SIZE);
                const aheadTileX = Math.floor(aheadX / TILE_SIZE);
                const tileBelowAhead = Level.getTile(aheadTileX, bottomTileY);
                if (tileBelowAhead === 0) {
                  e.vx = -e.vx; // 懸崖轉向
                }
              }

              e.x += e.vx;
              if (this.checkTileCollide(e, true)) {
                e.vx = -e.vx; // 遇牆轉向
              }
              e.y += e.vy;
              this.checkTileCollide(e, false);
            } else if (e.state === 'shell_idle') {
              e.y += e.vy;
              this.checkTileCollide(e, false);
              e.timer++;
              if (e.timer > 300) {
                e.state = 'walk';
                e.vx = -0.6;
                e.timer = 0;
              }
            } else if (e.state === 'shell_spin') {
              e.x += e.vx;
              if (this.checkTileCollide(e, true)) {
                e.vx = -e.vx;
                Audio.stomp();
              }
              e.y += e.vy;
              this.checkTileCollide(e, false);

              // 飛踢龜殼撞殺其他敵人
              for (let j = 0; j < this.enemies.length; j++) {
                const other = this.enemies[j];
                if (other.active && i !== j) {
                  if (this.rectOverlap(e.x, e.y, e.w, e.h, other.x, other.y, other.w, other.h)) {
                    other.active = false;
                    Audio.stomp();
                    HUD.addScore(200);
                    this.addScoreText('200', other.x, other.y - 10);
                  }
                }
              }
            }

            if (e.y > Level.heightInTiles * TILE_SIZE + 32) {
              e.active = false;
            }
          }
        }

        // 更新道具 (蘑菇)
        for (let i = 0; i < this.items.length; i++) {
          const it = this.items[i];
          if (it.active) {
            it.vy = Math.min(it.vy + 0.3, 5);
            it.x += it.vx;
            if (this.checkTileCollide(it, true)) {
              it.vx = -it.vx;
            }
            it.y += it.vy;
            this.checkTileCollide(it, false);

            if (it.y > Level.heightInTiles * TILE_SIZE + 32) {
              it.active = false;
            }
          }
        }

        // 更新金幣（拾取與彈跳特效）
        for (let i = 0; i < this.coins.length; i++) {
          const c = this.coins[i];
          if (c.active) {
            if (c.isBouncing) {
              c.y += c.vy;
              c.vy += 0.35;
              c.life--;
              if (c.life <= 0) c.active = false;
            } else {
              // 地圖上的金幣與主角重疊檢查
              if (this.rectOverlap(Player.x, Player.y, Player.w, Player.h, c.x, c.y, c.w, c.h)) {
                c.active = false;
                HUD.addCoin();
                Audio.coin();
                this.addScoreText('+200', c.x, c.y - 8);
              }
            }
          }
        }

        // 更新粒子
        for (let i = 0; i < this.particles.length; i++) {
          const p = this.particles[i];
          if (p.active) {
            p.x += p.vx;
            p.y += p.vy;
            p.vy += 0.25;
            p.life--;
            if (p.life <= 0) p.active = false;
          }
        }

        // 更新飄字
        for (let i = 0; i < this.floatingScores.length; i++) {
          const f = this.floatingScores[i];
          if (f.active) {
            f.y -= 0.6;
            f.life--;
            if (f.life <= 0) f.active = false;
          }
        }
      },

      checkTileCollide(obj, isX) {
        const left = Math.floor(obj.x / TILE_SIZE);
        const right = Math.floor((obj.x + obj.w - 0.01) / TILE_SIZE);
        const top = Math.floor(obj.y / TILE_SIZE);
        const bottom = Math.floor((obj.y + obj.h - 0.01) / TILE_SIZE);

        let collided = false;
        for (let ty = top; ty <= bottom; ty++) {
          for (let tx = left; tx <= right; tx++) {
            const tile = Level.getTile(tx, ty);
            if (tile === 1 || tile === 2 || tile === 3 || tile === 4 || tile === 5 || tile === 7) {
              collided = true;
              if (isX) {
                if (obj.vx > 0) obj.x = tx * TILE_SIZE - obj.w;
                else if (obj.vx < 0) obj.x = (tx + 1) * TILE_SIZE;
              } else {
                if (obj.vy > 0) {
                  obj.y = ty * TILE_SIZE - obj.h;
                  obj.vy = 0;
                } else if (obj.vy < 0) {
                  obj.y = (ty + 1) * TILE_SIZE;
                  obj.vy = 0;
                }
              }
              return true;
            }
          }
        }
        return collided;
      },

      rectOverlap(x1, y1, w1, h1, x2, y2, w2, h2) {
        return x1 < x2 + w2 && x1 + w1 > x2 && y1 < y2 + h2 && y1 + h1 > y2;
      }
    };
    Entities.init();

    // ==========================================
    // 6. 主角小紅物理與動作狀態 (Player)
    // ==========================================
    const Player = {
      x: 32,
      y: 100,
      vx: 0,
      vy: 0,
      w: 12,
      h: 15,
      isBig: false,
      isGrounded: false,
      coyoteTimer: 0,
      jumpBufferTimer: 0,
      invincibleTimer: 0,
      facingRight: true,
      state: 'idle',

      spawn(x, y) {
        this.x = x;
        this.y = y;
        this.vx = 0;
        this.vy = 0;
        this.isBig = false;
        this.w = 12;
        this.h = 15;
        this.isGrounded = false;
        this.coyoteTimer = 0;
        this.jumpBufferTimer = 0;
        this.invincibleTimer = 0;
        this.facingRight = true;
        this.state = 'idle';
      },

      grow() {
        if (!this.isBig) {
          this.isBig = true;
          this.h = 27;
          this.y -= 12;

          // 防卡磚安全校正：若變大後頭部塞入上方磚塊，將 y 往下微調或解除實心壓迫
          const topTileY = Math.floor(this.y / TILE_SIZE);
          const leftTileX = Math.floor(this.x / TILE_SIZE);
          const rightTileX = Math.floor((this.x + this.w - 0.01) / TILE_SIZE);
          const t1 = Level.getTile(leftTileX, topTileY);
          const t2 = Level.getTile(rightTileX, topTileY);
          if (t1 !== 0 || t2 !== 0) {
            this.y = (topTileY + 1) * TILE_SIZE;
          }

          Audio.powerup();
        }
      },

      shrink() {
        if (this.isBig) {
          this.isBig = false;
          this.h = 15;
          this.invincibleTimer = 120; // 2 秒無敵時間
          Audio.hit();
        } else {
          this.die();
        }
      },

      die() {
        Game.setState('dead');
        this.vy = -6.5;
        this.vx = 0;
        Audio.dead();
      },

      update() {
        if (Game.state === 'dead') {
          this.vy = Math.min(this.vy + 0.35, 7);
          this.y += this.vy;
          return;
        }

        if (this.invincibleTimer > 0) this.invincibleTimer--;

        // 跳躍緩衝 (Jump Buffer: 100ms ~ 6 frames)
        if (Input.jumpPressed) {
          this.jumpBufferTimer = 6;
        } else if (this.jumpBufferTimer > 0) {
          this.jumpBufferTimer--;
        }

        // 走跑切換
        const maxSpeed = Input.run ? 2.8 : 1.7;
        const accel = this.isGrounded ? 0.16 : 0.08;
        const friction = this.isGrounded ? 0.82 : 0.94;

        if (Input.left) {
          this.vx -= accel;
          if (this.vx < -maxSpeed) this.vx = -maxSpeed;
          this.facingRight = false;
        } else if (Input.right) {
          this.vx += accel;
          if (this.vx > maxSpeed) this.vx = maxSpeed;
          this.facingRight = true;
        } else {
          this.vx *= friction;
          if (Math.abs(this.vx) < 0.05) this.vx = 0;
        }

        // 重力下落極限
        this.vy = Math.min(this.vy + 0.38, 7.5);

        // 狼跳 (Coyote Time: 100ms ~ 6 frames)
        if (this.isGrounded) {
          this.coyoteTimer = 6;
        } else if (this.coyoteTimer > 0) {
          this.coyoteTimer--;
        }

        // 執行跳躍
        if (this.jumpBufferTimer > 0 && this.coyoteTimer > 0) {
          this.vy = -6.4;
          this.jumpBufferTimer = 0;
          this.coyoteTimer = 0;
          this.isGrounded = false;
          Audio.jump();
        }

        // 可變高度跳躍截斷
        if (!Input.jump && this.vy < -2.2) {
          this.vy = -2.2;
        }

        // X 軸分離移動與碰撞
        this.x += this.vx;
        this.resolveMapCollision(true);

        // Y 軸分離移動與碰撞
        this.isGrounded = false;
        this.y += this.vy;
        this.resolveMapCollision(false);

        // 移動平台承載檢驗
        for (let i = 0; i < Entities.platforms.length; i++) {
          const plat = Entities.platforms[i];
          if (plat.active) {
            if (this.vy >= 0 &&
                this.x + this.w > plat.x && this.x < plat.x + plat.w &&
                this.y + this.h >= plat.y && this.y + this.h <= plat.y + 8) {
              this.y = plat.y - this.h;
              this.vy = 0;
              this.isGrounded = true;
              this.x += plat.vx;
            }
          }
        }

        // 敵人互動判定
        for (let i = 0; i < Entities.enemies.length; i++) {
          const en = Entities.enemies[i];
          if (en.active) {
            if (Entities.rectOverlap(this.x, this.y, this.w, this.h, en.x, en.y, en.w, en.h)) {
              if (this.vy > 0 && (this.y + this.h - this.vy) <= en.y + 7) {
                this.vy = -5.0; // 踩踏彈跳
                if (en.type === 'shroom') {
                  en.active = false;
                  Audio.stomp();
                  HUD.addScore(100);
                  Entities.addScoreText('100', en.x, en.y - 10);
                } else if (en.type === 'turtle') {
                  if (en.state === 'walk') {
                    en.state = 'shell_idle';
                    en.vx = 0;
                    en.timer = 0;
                    Audio.stomp();
                    HUD.addScore(100);
                    Entities.addScoreText('100', en.x, en.y - 10);
                  } else if (en.state === 'shell_idle') {
                    en.state = 'shell_spin';
                    en.vx = this.facingRight ? 3.5 : -3.5;
                    Audio.stomp();
                  } else if (en.state === 'shell_spin') {
                    en.state = 'shell_idle';
                    en.vx = 0;
                    Audio.stomp();
                  }
                }
              } else {
                if (en.state === 'shell_idle') {
                  en.state = 'shell_spin';
                  en.vx = (this.x < en.x) ? 3.5 : -3.5;
                  Audio.stomp();
                } else if (this.invincibleTimer <= 0) {
                  this.shrink();
                }
              }
            }
          }
        }

        // 道具拾取 (蘑菇)
        for (let i = 0; i < Entities.items.length; i++) {
          const it = Entities.items[i];
          if (it.active) {
            if (Entities.rectOverlap(this.x, this.y, this.w, this.h, it.x, it.y, it.w, it.h)) {
              it.active = false;
              this.grow();
              HUD.addScore(1000);
              Entities.addScoreText('1000', it.x, it.y - 10);
            }
          }
        }

        // 掉落深淵死亡
        if (this.y > Level.heightInTiles * TILE_SIZE + 16) {
          this.die();
        }

        // 碰到旗桿過關
        if (this.x >= Level.flagX && Game.state === 'playing') {
          Game.setState('levelClear');
          Audio.win();
          HUD.addScore(1000 + HUD.time * 50);
        }

        // 動畫狀態更新
        if (!this.isGrounded) {
          this.state = 'jump';
        } else if (Math.abs(this.vx) > 0.2) {
          this.state = 'run';
        } else {
          this.state = 'idle';
        }
      },

      resolveMapCollision(isX) {
        const left = Math.floor(this.x / TILE_SIZE);
        const right = Math.floor((this.x + this.w - 0.01) / TILE_SIZE);
        const top = Math.floor(this.y / TILE_SIZE);
        const bottom = Math.floor((this.y + this.h - 0.01) / TILE_SIZE);

        for (let ty = top; ty <= bottom; ty++) {
          for (let tx = left; tx <= right; tx++) {
            const tile = Level.getTile(tx, ty);
            if (tile === 1 || tile === 2 || tile === 3 || tile === 4 || tile === 5 || tile === 7) {
              if (isX) {
                if (this.vx > 0) this.x = tx * TILE_SIZE - this.w;
                else if (this.vx < 0) this.x = (tx + 1) * TILE_SIZE;
                this.vx = 0;
                return;
              } else {
                if (this.vy > 0) {
                  this.y = ty * TILE_SIZE - this.h;
                  this.vy = 0;
                  this.isGrounded = true;
                  return;
                } else if (this.vy < 0) {
                  this.y = (ty + 1) * TILE_SIZE;
                  this.vy = 0;
                  // 頭頂方塊事件
                  this.onHitBlock(tx, ty, tile);
                  return;
                }
              }
            }
          }
        }
      },

      onHitBlock(tx, ty, tile) {
        if (tile === 3) {
          // 問號方塊彈出道具或金幣並產生彈跳動畫
          Level.setTile(tx, ty, 7);
          Entities.triggerBounceBlock(tx, ty, 7);
          if (!this.isBig) {
            Entities.spawnItem('mushroom', tx * TILE_SIZE, (ty - 1) * TILE_SIZE);
            Audio.powerup();
          } else {
            HUD.addCoin();
            Audio.coin();
            Entities.spawnBounceCoin(tx * TILE_SIZE + 2, (ty - 1) * TILE_SIZE);
            Entities.addScoreText('+200', tx * TILE_SIZE, (ty - 1) * TILE_SIZE);
          }
        } else if (tile === 2) {
          // 磚塊
          if (this.isBig) {
            Level.setTile(tx, ty, 0); // 碎磚
            Entities.emitBlockDebris(tx * TILE_SIZE, ty * TILE_SIZE);
            Audio.stomp();
            HUD.addScore(50);
          } else {
            Entities.triggerBounceBlock(tx, ty, 2);
            Audio.stomp();
          }
        }
      }
    };

    // ==========================================
    // 7. HUD 與分數管理 (HUD)
    // ==========================================
    const HUD = {
      score: 0,
      coins: 0,
      lives: 3,
      time: 400,
      highScore: 0,
      timeCounter: 0,

      init() {
        try {
          const saved = localStorage.getItem('red_adventure_hi');
          if (saved) this.highScore = parseInt(saved, 10) || 0;
        } catch (e) {
          this.highScore = 0;
        }
      },

      reset() {
        this.score = 0;
        this.coins = 0;
        this.lives = 3;
        this.time = 400;
        this.timeCounter = 0;
      },

      addScore(pts) {
        this.score += pts;
        if (this.score > this.highScore) {
          this.highScore = this.score;
          try {
            localStorage.setItem('red_adventure_hi', this.highScore.toString());
          } catch (e) {}
        }
      },

      addCoin() {
        this.coins++;
        this.addScore(200);
        if (this.coins >= 100) {
          this.coins -= 100;
          this.lives++;
        }
      },

      update() {
        if (Game.state === 'playing') {
          this.timeCounter++;
          if (this.timeCounter >= 60) {
            this.timeCounter = 0;
            this.time--;
            if (this.time <= 0) {
              Player.die();
            }
          }
        }
      },

      draw(ctx) {
        ctx.save();
        ctx.fillStyle = '#ffffff';
        ctx.font = '10px monospace';
        ctx.shadowColor = '#000000';
        ctx.shadowOffsetX = 1;
        ctx.shadowOffsetY = 1;

        ctx.fillText(`SCORE: ${this.score}`, 16, 14);
        ctx.fillText(`COINS: ${this.coins}`, 110, 14);
        ctx.fillText(`WORLD: 1-${Level.currentLevelIndex + 1}`, 200, 14);
        ctx.fillText(`TIME: ${this.time}`, 290, 14);
        ctx.fillText(`LIVES: ${this.lives}`, 360, 14);

        // 暫停與靜音鈕
        const pBtn = Input.areas.btnPause;
        ctx.fillStyle = 'rgba(255,255,255,0.2)';
        ctx.fillRect(pBtn.x, pBtn.y, pBtn.w, pBtn.h);
        ctx.fillStyle = '#fff';
        ctx.fillText('II', pBtn.x + 10, pBtn.y + 20);

        const mBtn = Input.areas.btnMute;
        ctx.fillStyle = 'rgba(255,255,255,0.2)';
        ctx.fillRect(mBtn.x, mBtn.y, mBtn.w, mBtn.h);
        ctx.fillStyle = '#fff';
        ctx.fillText(Audio.muted ? 'M' : 'S', mBtn.x + 10, mBtn.y + 20);

        ctx.restore();
      }
    };
    HUD.init();

    // ==========================================
    // 8. 渲染系統 (Render)
    // ==========================================
    const Render = {
      draw(ctx) {
        // 背景天色或地下暗色
        ctx.fillStyle = Level.skyColor;
        ctx.fillRect(0, 0, VIEW_W, VIEW_H);

        const camX = Math.floor(Level.cameraX);

        // 繪製 Tilemap
        const startCol = Math.max(0, Math.floor(camX / TILE_SIZE));
        const endCol = Math.min(Level.widthInTiles, Math.ceil((camX + VIEW_W) / TILE_SIZE) + 1);

        const groundSpr = Level.theme === 'underground' ? SpriteSheets.tile_underground_ground : SpriteSheets.tile_ground;
        const brickSpr = Level.theme === 'underground' ? SpriteSheets.block_underground_brick : SpriteSheets.block_brick;

        for (let y = 0; y < Level.heightInTiles; y++) {
          for (let x = startCol; x < endCol; x++) {
            const tile = Level.tiles[y][x];
            const px = x * TILE_SIZE - camX;
            const py = y * TILE_SIZE;

            if (tile === 1) {
              ctx.drawImage(groundSpr, px, py);
            } else if (tile === 2) {
              ctx.drawImage(brickSpr, px, py);
            } else if (tile === 3) {
              ctx.drawImage(SpriteSheets.block_question, px, py);
            } else if (tile === 4) {
              ctx.drawImage(SpriteSheets.tile_pipe_top, px, py);
            } else if (tile === 5) {
              ctx.drawImage(SpriteSheets.tile_pipe_body, px, py);
            } else if (tile === 6) {
              ctx.drawImage(SpriteSheets.flag_pole, px, py);
            } else if (tile === 7) {
              ctx.drawImage(SpriteSheets.block_empty, px, py);
            }
          }
        }

        // 繪製彈跳中之方塊位移動畫
        for (let i = 0; i < Entities.bouncingBlocks.length; i++) {
          const b = Entities.bouncingBlocks[i];
          if (b.active) {
            const bx = b.tx * TILE_SIZE - camX;
            const by = b.ty * TILE_SIZE + b.offset;
            const bSpr = (b.tile === 7) ? SpriteSheets.block_empty : brickSpr;
            ctx.drawImage(bSpr, bx, by);
          }
        }

        // 繪製金幣（地圖收集與彈跳）
        for (let i = 0; i < Entities.coins.length; i++) {
          const c = Entities.coins[i];
          if (c.active) {
            ctx.drawImage(SpriteSheets.item_coin, Math.floor(c.x - camX), Math.floor(c.y));
          }
        }

        // 繪製移動平台
        for (let i = 0; i < Entities.platforms.length; i++) {
          const p = Entities.platforms[i];
          if (p.active) {
            ctx.drawImage(SpriteSheets.moving_platform, Math.floor(p.x - camX), Math.floor(p.y));
            ctx.drawImage(SpriteSheets.moving_platform, Math.floor(p.x + 16 - camX), Math.floor(p.y));
          }
        }

        // 繪製道具 (蘑菇)
        for (let i = 0; i < Entities.items.length; i++) {
          const it = Entities.items[i];
          if (it.active) {
            ctx.drawImage(SpriteSheets.item_mushroom, Math.floor(it.x - camX), Math.floor(it.y));
          }
        }

        // 繪製敵人
        for (let i = 0; i < Entities.enemies.length; i++) {
          const en = Entities.enemies[i];
          if (en.active) {
            const ex = Math.floor(en.x - camX);
            const ey = Math.floor(en.y);
            if (en.type === 'shroom') {
              ctx.drawImage(SpriteSheets.shroom_enemy, ex, ey);
            } else if (en.type === 'turtle') {
              if (en.state === 'walk') {
                ctx.drawImage(SpriteSheets.turtle_enemy, ex, ey);
              } else {
                ctx.drawImage(SpriteSheets.turtle_shell, ex, ey);
              }
            }
          }
        }

        // 繪製破片粒子
        for (let i = 0; i < Entities.particles.length; i++) {
          const p = Entities.particles[i];
          if (p.active) {
            ctx.fillStyle = p.color;
            ctx.fillRect(Math.floor(p.x - camX), Math.floor(p.y), p.size, p.size);
          }
        }

        // 繪製主角小紅
        if (Player.invincibleTimer === 0 || Math.floor(Player.invincibleTimer / 4) % 2 === 0) {
          ctx.save();
          const px = Math.floor(Player.x - camX);
          const py = Math.floor(Player.y);

          let spr = SpriteSheets.red_idle;
          if (Game.state === 'dead') spr = SpriteSheets.red_dead;
          else if (Player.state === 'jump') spr = SpriteSheets.red_jump;
          else if (Player.state === 'run') spr = SpriteSheets.red_run;

          ctx.translate(px + Player.w / 2, py + Player.h / 2);
          if (!Player.facingRight) ctx.scale(-1, 1);
          if (Player.isBig) {
            ctx.drawImage(spr, -8, -14, 16, 28);
          } else {
            ctx.drawImage(spr, -8, -8, 16, 16);
          }
          ctx.restore();
        }

        // 繪製浮動文字
        ctx.fillStyle = '#ffd700';
        ctx.font = '10px monospace';
        for (let i = 0; i < Entities.floatingScores.length; i++) {
          const f = Entities.floatingScores[i];
          if (f.active) {
            ctx.fillText(f.text, Math.floor(f.x - camX), Math.floor(f.y));
          }
        }

        // 繪製觸控介面
        this.drawControls(ctx);

        // 繪製 HUD
        HUD.draw(ctx);

        // 繪製疊層
        this.drawOverlays(ctx);
      },

      drawControls(ctx) {
        ctx.save();
        ctx.fillStyle = 'rgba(255, 255, 255, 0.25)';
        ctx.strokeStyle = 'rgba(255, 255, 255, 0.45)';
        ctx.lineWidth = 2;

        const a = Input.areas;
        // 左鍵
        ctx.strokeRect(a.dpadLeft.x, a.dpadLeft.y, a.dpadLeft.w, a.dpadLeft.h);
        if (Input.left) ctx.fillRect(a.dpadLeft.x, a.dpadLeft.y, a.dpadLeft.w, a.dpadLeft.h);

        // 右鍵
        ctx.strokeRect(a.dpadRight.x, a.dpadRight.y, a.dpadRight.w, a.dpadRight.h);
        if (Input.right) ctx.fillRect(a.dpadRight.x, a.dpadRight.y, a.dpadRight.w, a.dpadRight.h);

        // 跑
        ctx.beginPath();
        ctx.arc(a.btnRun.x + a.btnRun.w / 2, a.btnRun.y + a.btnRun.h / 2, a.btnRun.w / 2, 0, Math.PI * 2);
        ctx.stroke();
        if (Input.run) ctx.fill();

        // 跳
        ctx.beginPath();
        ctx.arc(a.btnJump.x + a.btnJump.w / 2, a.btnJump.y + a.btnJump.h / 2, a.btnJump.w / 2, 0, Math.PI * 2);
        ctx.stroke();
        if (Input.jump) ctx.fill();

        ctx.fillStyle = '#fff';
        ctx.font = '12px monospace';
        ctx.fillText('◄', a.dpadLeft.x + 24, a.dpadLeft.y + 38);
        ctx.fillText('►', a.dpadRight.x + 24, a.dpadRight.y + 38);
        ctx.fillText('RUN', a.btnRun.x + 17, a.btnRun.y + 32);
        ctx.fillText('JUMP', a.btnJump.x + 15, a.btnJump.y + 38);
        ctx.restore();
      },

      drawOverlays(ctx) {
        ctx.save();
        ctx.textAlign = 'center';

        if (Game.state === 'title') {
          ctx.fillStyle = 'rgba(0, 0, 0, 0.75)';
          ctx.fillRect(0, 0, VIEW_W, VIEW_H);

          ctx.fillStyle = '#ff4757';
          ctx.font = 'bold 24px monospace';
          ctx.fillText('小紅冒險 RED ADVENTURE', VIEW_W / 2, 85);

          ctx.fillStyle = '#ffffff';
          ctx.font = '12px monospace';
          ctx.fillText(`HI-SCORE: ${HUD.highScore}`, VIEW_W / 2, 115);
          ctx.fillText('按「跳」或點擊螢幕任意處開始', VIEW_W / 2, 160);

          ctx.fillStyle = '#a4b0be';
          ctx.font = '10px monospace';
          ctx.fillText('操作說明: 左右移, 空白鍵/W/JUMP跳, Shift/RUN加速, P暫停', VIEW_W / 2, 210);
        } else if (Game.state === 'paused') {
          ctx.fillStyle = 'rgba(0, 0, 0, 0.65)';
          ctx.fillRect(0, 0, VIEW_W, VIEW_H);

          ctx.fillStyle = '#f1f2f6';
          ctx.font = 'bold 20px monospace';
          ctx.fillText('遊戲暫停 PAUSED', VIEW_W / 2, 120);

          ctx.font = '12px monospace';
          ctx.fillText('按 P 鍵或點右上鈕繼續', VIEW_W / 2, 155);
        } else if (Game.state === 'levelClear') {
          ctx.fillStyle = 'rgba(0, 0, 0, 0.7)';
          ctx.fillRect(0, 0, VIEW_W, VIEW_H);

          ctx.fillStyle = '#2ed573';
          ctx.font = 'bold 20px monospace';
          ctx.fillText('關卡完成 LEVEL CLEAR!', VIEW_W / 2, 115);

          ctx.fillStyle = '#ffffff';
          ctx.font = '12px monospace';
          ctx.fillText(`時間加成得分: +${HUD.time * 50}`, VIEW_W / 2, 145);
          ctx.fillText('按「跳」或點擊螢幕前進下一關', VIEW_W / 2, 180);
        } else if (Game.state === 'gameOver') {
          ctx.fillStyle = 'rgba(0, 0, 0, 0.85)';
          ctx.fillRect(0, 0, VIEW_W, VIEW_H);

          ctx.fillStyle = '#ff4757';
          ctx.font = 'bold 22px monospace';
          ctx.fillText('GAME OVER', VIEW_W / 2, 115);

          ctx.fillStyle = '#ffffff';
          ctx.font = '12px monospace';
          ctx.fillText(`最終分數: ${HUD.score} | 最高紀錄: ${HUD.highScore}`, VIEW_W / 2, 145);
          ctx.fillText('按「跳」或點擊螢幕重新開始', VIEW_W / 2, 180);
        }
        ctx.restore();
      }
    };

    // ==========================================
    // 9. 主狀態機與主迴圈 (Game)
    // ==========================================
    const Game = {
      canvas: null,
      ctx: null,
      state: 'title',
      stateTimer: 0,
      accumulator: 0,
      lastTime: 0,

      init() {
        this.canvas = document.getElementById('gameCanvas');
        this.ctx = this.canvas.getContext('2d', { alpha: false });

        this.fitCanvas();
        window.addEventListener('resize', () => this.fitCanvas());
        window.addEventListener('orientationchange', () => this.fitCanvas());

        // iPad 背景自動暫停與切回時防止物理爆衝
        document.addEventListener('visibilitychange', () => {
          if (document.hidden) {
            this.handleBackgroundPause();
          } else {
            this.resetLoopTiming();
          }
        });

        window.addEventListener('blur', () => {
          this.handleBackgroundPause();
        });

        window.addEventListener('focus', () => {
          this.resetLoopTiming();
        });

        Input.init(this.canvas);
        Level.load(0);

        this.lastTime = performance.now();
        requestAnimationFrame((t) => this.loop(t));
      },

      handleBackgroundPause() {
        if (this.state === 'playing') {
          this.setState('paused');
        }
        Input.reset();
        this.accumulator = 0;
      },

      resetLoopTiming() {
        this.lastTime = performance.now();
        this.accumulator = 0;
      },

      fitCanvas() {
        const hint = document.getElementById('rotate-hint');
        const winW = window.innerWidth;
        const winH = window.innerHeight;

        // 直向旋轉提示（支援所有尺寸之 iPad 與手機）
        if (winH > winW) {
          hint.style.display = 'flex';
        } else {
          hint.style.display = 'none';
        }

        // 整數倍率縮放保持像素銳利
        let intScale = Math.floor(Math.min(winW / VIEW_W, winH / VIEW_H));
        if (intScale < 1) intScale = Math.min(winW / VIEW_W, winH / VIEW_H);

        const dpr = window.devicePixelRatio || 1;
        this.canvas.width = VIEW_W * dpr;
        this.canvas.height = VIEW_H * dpr;
        this.ctx.imageSmoothingEnabled = false;
        this.ctx.scale(dpr, dpr);

        const cssW = Math.floor(VIEW_W * intScale);
        const cssH = Math.floor(VIEW_H * intScale);
        this.canvas.style.width = `${cssW}px`;
        this.canvas.style.height = `${cssH}px`;
      },

      setState(newState) {
        this.state = newState;
        this.stateTimer = 0;
      },

      fixedUpdate() {
        Input.update();

        // 暫停鍵切換
        if (Input.pausePressed) {
          Input.pausePressed = false;
          if (this.state === 'playing') {
            this.setState('paused');
          } else if (this.state === 'paused') {
            this.setState('playing');
          }
        }

        if (this.state === 'title') {
          if (Input.jumpPressed || Input.screenTapped) {
            Input.screenTapped = false;
            HUD.reset();
            Level.load(0);
            this.setState('playing');
          }
        } else if (this.state === 'playing') {
          Input.screenTapped = false;
          Player.update();
          Entities.update();
          Level.updateCamera(Player.x);
          HUD.update();
        } else if (this.state === 'dead') {
          Input.screenTapped = false;
          Player.update();
          this.stateTimer++;
          if (this.stateTimer > 90) {
            HUD.lives--;
            if (HUD.lives > 0) {
              HUD.time = 400;
              Level.load(Level.currentLevelIndex);
              this.setState('playing');
            } else {
              this.setState('gameOver');
            }
          }
        } else if (this.state === 'levelClear') {
          this.stateTimer++;
          if (Input.jumpPressed || Input.screenTapped || this.stateTimer > 180) {
            Input.screenTapped = false;
            Level.load(Level.currentLevelIndex + 1);
            HUD.time = 400;
            this.setState('playing');
          }
        } else if (this.state === 'gameOver') {
          this.stateTimer++;
          if ((Input.jumpPressed || Input.screenTapped) && this.stateTimer > 30) {
            Input.screenTapped = false;
            HUD.reset();
            Level.load(0);
            this.setState('playing');
          }
        }
      },

      loop(currentTime) {
        let delta = (currentTime - this.lastTime) / 1000;
        this.lastTime = currentTime;

        // 防切回後台瞬間時間累積爆衝
        if (delta > 0.1) delta = 0.1;

        this.accumulator += delta;
        while (this.accumulator >= STEP_SEC) {
          this.fixedUpdate();
          this.accumulator -= STEP_SEC;
        }

        Render.draw(this.ctx);

        requestAnimationFrame((t) => this.loop(t));
      }
    };

    // ==========================================
    // 10. 掛載全域架構約定物件
    // ==========================================
    window.Game = Game;
    window.Input = Input;
    window.Level = Level;
    window.Player = Player;
    window.Entities = Entities;
    window.Render = Render;
    window.Audio = Audio;
    window.HUD = HUD;

    // 啟動遊戲
    window.addEventListener('DOMContentLoaded', () => {
      Game.init();
    });
  })();
  </script>
</body>
</html>
