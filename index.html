<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <!-- 針對 iPad 及行動裝置優化：禁止縮放、鎖定檢視區 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>iPad 專屬高質感貪食蛇遊戲</title>
    <style>
        /* CSS Reset 與 iPad 專屬防干涉設定 */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-user-select: none; /* 防止 iOS 文字與元素選取 */
            user-select: none;
            -webkit-touch-callout: none; /* 防止長按彈出選單 */
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden; /* 絕對禁止全頁滾動條 */
            background-color: #121212;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            color: #ffffff;
            touch-action: none; /* 防止預設觸控手勢干擾 */
        }

        /* 響應式佈局容器：垂直彈性排列，確保畫面緊湊 */
        .game-container {
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            height: 100%;
            padding: env(safe-area-inset-top, 10px) 10px env(safe-area-inset-bottom, 10px) 10px;
            max-width: 500px;
            margin: 0 auto;
        }

        /* 頂部計分板 */
        .score-board {
            display: flex;
            justify-content: space-around;
            width: 100%;
            padding: 10px 0;
            background: #1e1e1e;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }

        .score-item {
            text-align: center;
        }

        .score-label {
            font-size: 12px;
            color: #888;
            margin-bottom: 2px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .score-value {
            font-size: 20px;
            font-weight: bold;
            color: #4CAF50;
        }

        /* Canvas 畫布外框與置中 */
        .canvas-wrapper {
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-grow: 1;
            margin: 10px 0;
            width: 100%;
        }

        canvas {
            background-color: #1a1a1a;
            border: 3px solid #333;
            border-radius: 8px;
            box-shadow: 0 8px 16px rgba(0,0,0,0.5);
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }

        /* 遊戲結束覆蓋層 */
        .game-over-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            border-radius: 8px;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }

        .game-over-overlay.visible {
            opacity: 1;
            pointer-events: auto;
        }

        .game-over-title {
            font-size: 28px;
            font-weight: bold;
            color: #ff5252;
            margin-bottom: 10px;
        }

        .game-over-text {
            font-size: 16px;
            color: #ccc;
            margin-bottom: 20px;
        }

        /* iPad 虛擬 D-Pad 按鍵區 */
        .controls-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100%;
            padding-bottom: 10px;
        }

        .dpad {
            position: relative;
            width: 200px;
            height: 200px;
        }

        .dpad-btn {
            position: absolute;
            background-color: #2a2a2a;
            color: #fff;
            border: 2px solid #444;
            border-radius: 14px;
            font-size: 24px;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            transition: background-color 0.1s, transform 0.1s;
        }

        /* 點擊時的視覺回饋與防按壓偏移 */
        .dpad-btn:active, .btn-primary:active {
            background-color: #4CAF50;
            transform: scale(0.95);
        }

        .btn-up { top: 0; left: 60px; width: 80px; height: 60px; }
        .btn-down { bottom: 0; left: 60px; width: 80px; height: 60px; }
        .btn-left { top: 60px; left: 0; width: 60px; height: 80px; }
        .btn-right { top: 60px; right: 0; width: 60px; height: 80px; }
        .btn-center { top: 60px; left: 60px; width: 80px; height: 80px; background: #1a1a1a; border: none; box-shadow: none; font-size: 12px; color: #666; }

        /* 開始/重新開始通用按鈕 */
        .btn-primary {
            background-color: #4CAF50;
            color: white;
            border: none;
            padding: 12px 30px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }
    </style>
</head>
<body>
    <div class="game-container">
        <!-- 頂部計分板 -->
        <div class="score-board">
            <div class="score-item">
                <div class="score-label">分數</div>
                <div id="current-score" class="score-value">0</div>
            </div>
            <div class="score-item">
                <div class="score-label">最高分</div>
                <div id="high-score" class="score-value">0</div>
            </div>
        </div>

        <!-- 遊戲畫布與結束覆蓋層 -->
        <div class="canvas-wrapper">
            <canvas id="gameCanvas" width="400" height="400"></canvas>
            
            <div id="gameOverOverlay" class="game-over-overlay">
                <div class="game-over-title">遊戲結束</div>
                <div id="finalScoreText" class="game-over-text">得分: 0</div>
                <button id="restartBtn" class="btn-primary">再玩一次</button>
            </div>
        </div>

        <!-- 底部 iPad 專用觸控虛擬方向鍵 -->
        <div class="controls-container">
            <div class="dpad">
                <button class="dpad-btn btn-up" data-dir="UP">▲</button>
                <button class="dpad-btn btn-left" data-dir="LEFT">◀</button>
                <button class="dpad-btn btn-center">iPad</button>
                <button class="dpad-btn btn-right" data-dir="RIGHT">▶</button>
                <button class="dpad-btn btn-down" data-dir="DOWN">▼</button>
            </div>
        </div>
    </div>

    <script>
        // ==========================================
        // 1. 遊戲常數與全域變數定義
        // ==========================================
        const CANVAS_SIZE = 400;     // 畫布總像素寬高
        const GRID_COUNT = 20;       // 網格總數 (20x20)
        const TILE_SIZE = CANVAS_SIZE / GRID_COUNT; // 每個格子的大小 (20px)
        const GAME_SPEED = 120;      // 遊戲迴圈更新間隔 (毫秒)

        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const currentScoreEl = document.getElementById('current-score');
        const highScoreEl = document.getElementById('high-score');
        const gameOverOverlay = document.getElementById('gameOverOverlay');
        const finalScoreText = document.getElementById('finalScoreText');
        const restartBtn = document.getElementById('restartBtn');

        // 遊戲狀態變數
        let snake = [];
        let food = { x: 0, y: 0 };
        let dx = 1; // X 軸移動方向 (-1:左, 1:右, 0:靜止)
        let dy = 0; // Y 軸移動方向 (-1:上, 1:下, 0:靜止)
        let nextDx = 1; // 緩衝下一次方向，防止快速點擊導致原地自殺
        let nextDy = 0;
        let score = 0;
        let highScore = localStorage.getItem('snake_highscore') || 0;
        let isGameRunning = false;
        let gameInterval = null;

        // 初始化最高分顯示
        highScoreEl.textContent = highScore;

        // ==========================================
        // 2. 遊戲初始化與重置
        // ==========================================
        function initGame() {
            // 初始化蛇身：長度 3，置於畫布中央
            snake = [
                { x: 10, y: 10 },
                { x: 9, y: 10 },
                { x: 8, y: 10 }
            ];
            score = 0;
            currentScoreEl.textContent = score;
            dx = 1;
            dy = 0;
            nextDx = 1;
            nextDy = 0;
            
            spawnFood();
            gameOverOverlay.classList.remove('visible');
            isGameRunning = true;

            // 啟動遊戲循環
            if (gameInterval) clearInterval(gameInterval);
            gameInterval = setInterval(gameLoop, GAME_SPEED);
        }

        // ==========================================
        // 3. 食物生成邏輯
        // ==========================================
        function spawnFood() {
            let valid = false;
            while (!valid) {
                food.x = Math.floor(Math.random() * GRID_COUNT);
                food.y = Math.floor(Math.random() * GRID_COUNT);

                // 確保食物不會隨機生成在蛇身上
                valid = !snake.some(segment => segment.x === food.x && segment.y === food.y);
            }
        }

        // ==========================================
        // 4. 核心遊戲循環 (Game Loop)
        // ==========================================
        function gameLoop() {
            update();
            if (isGameRunning) {
                draw();
            }
        }

        // ==========================================
        // 5. 遊戲狀態更新與碰撞檢測
        // ==========================================
        function update() {
            // 套用方向緩衝區，確保每格移動只轉向一次
            dx = nextDx;
            dy = nextDy;

            // 計算新的蛇頭位置
            const head = { x: snake[0].x + dx, y: snake[0].y + dy };

            // 撞牆檢測 (超出 0 ~ GRID_COUNT-1 範圍即死亡)
            if (head.x < 0 || head.x >= GRID_COUNT || head.y < 0 || head.y >= GRID_COUNT) {
                gameOver();
                return;
            }

            // 撞自身檢測
            if (snake.some(segment => segment.x === head.x && segment.y === head.y)) {
                gameOver();
                return;
            }

            // 將新頭部插入蛇身陣列前端
            snake.unshift(head);

            // 檢測是否吃到食物
            if (head.x === food.x && head.y === food.y) {
                score += 10;
                currentScoreEl.textContent = score;
                
                // 更新最高分
                if (score > highScore) {
                    highScore = score;
                    highScoreEl.textContent = highScore;
                    localStorage.setItem('snake_highscore', highScore);
                }
                spawnFood();
            } else {
                // 若沒吃到食物，移除蛇尾以維持長度
                snake.pop();
            }
        }

        // ==========================================
        // 6. 畫面渲染系統 (Canvas 繪圖)
        // ==========================================
        function draw() {
            // 清空畫布背景
            ctx.fillStyle = '#1a1a1a';
            ctx.fillRect(0, 0, CANVAS_SIZE, CANVAS_SIZE);

            // 繪製格線 (增加視覺精緻度，每個方塊留 1px 隙縫)
            ctx.fillStyle = '#222222';
            for (let i = 0; i < GRID_COUNT; i++) {
                for (let j = 0; j < GRID_COUNT; j++) {
                    ctx.fillRect(i * TILE_SIZE + 1, j * TILE_SIZE + 1, TILE_SIZE - 2, TILE_SIZE - 2);
                }
            }

            // 繪製食物 (紅色圓形)
            ctx.fillStyle = '#ff5252';
            ctx.beginPath();
            ctx.arc(
                food.x * TILE_SIZE + TILE_SIZE / 2,
                food.y * TILE_SIZE + TILE_SIZE / 2,
                TILE_SIZE / 2 - 2,
                0,
                Math.PI * 2
            );
            ctx.fill();

            // 繪製蛇身與蛇頭
            snake.forEach((segment, index) => {
                // 蛇頭用深綠色/亮綠色區隔，蛇身用一般綠色
                ctx.fillStyle = index === 0 ? '#2E7D32' : '#4CAF50';
                ctx.fillRect(
                    segment.x * TILE_SIZE + 1,
                    segment.y * TILE_SIZE + 1,
                    TILE_SIZE - 2,
                    TILE_SIZE - 2
                );
            });
        }

        // ==========================================
        // 7. 遊戲結束處理
        // ==========================================
        function gameOver() {
            isGameRunning = false;
            clearInterval(gameInterval);
            finalScoreText.textContent = `最終得分: ${score}`;
            gameOverOverlay.classList.add('visible');
        }

        // ==========================================
        // 8. 輸入控制系統 (觸控與鍵盤備援 + 防自殺轉向)
        // ==========================================
        function changeDirection(dir) {
            if (!isGameRunning) return;

            // 防自殺機制：當向右移動時，不允許直接轉向左側
            if (dir === 'UP' && dy === 0) {
                nextDx = 0; nextDy = -1;
            } else if (dir === 'DOWN' && dy === 0) {
                nextDx = 0; nextDy = 1;
            } else if (dir === 'LEFT' && dx === 0) {
                nextDx = -1; nextDy = 0;
            } else if (dir === 'RIGHT' && dx === 0) {
                nextDx = 1; nextDy = 0;
            }
        }

        // 綁定 iPad 虛擬 D-Pad 觸控事件 (使用 touchstart + e.preventDefault 消除 iOS 延遲)
        const dpadButtons = document.querySelectorAll('.dpad-btn[data-dir]');
        dpadButtons.forEach(btn => {
            btn.addEventListener('touchstart', (e) => {
                e.preventDefault(); // 防止 iOS 雙擊放大與滾動
                const dir = btn.getAttribute('data-dir');
                changeDirection(dir);
            }, { passive: false });

            // 同時支援滑鼠點擊 (方便桌機模擬測試)
            btn.addEventListener('click', () => {
                const dir = btn.getAttribute('data-dir');
                changeDirection(dir);
            });
        });

        // 重新開始按鈕事件
        restartBtn.addEventListener('touchstart', (e) => {
            e.preventDefault();
            initGame();
        }, { passive: false });

        restartBtn.addEventListener('click', () => {
            initGame();
        });

        // 鍵盤備援控制 (支援方向鍵與 WASD)
        window.addEventListener('keydown', (e) => {
            switch (e.key) {
                case 'ArrowUp':
                case 'w':
                case 'W':
                    changeDirection('UP');
                    break;
                case 'ArrowDown':
                case 's':
                case 'S':
                    changeDirection('DOWN');
                    break;
                case 'ArrowLeft':
                case 'a':
                case 'A':
                    changeDirection('LEFT');
                    break;
                case 'ArrowRight':
                case 'd':
                case 'D':
                    changeDirection('RIGHT');
                    break;
            }
        });

        // ==========================================
        // 9. 啟動遊戲初始狀態
        // ==========================================
        initGame();
    </script>
</body>
</html>
