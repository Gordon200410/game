<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Super Mario Bros - iPad Retro Edition</title>
  <style>
    :root {
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
      --safe-left: env(safe-area-inset-left, 0px);
      --safe-right: env(safe-area-inset-right, 0px);
    }

    * {
      box-sizing: border-box;
      -webkit-touch-callout: none;
      -webkit-user-select: none;
      user-select: none;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #0c0d12;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace;
      touch-action: none;
    }

    #app-container {
      position: relative;
      width: 100vw;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: radial-gradient(circle, #1a1c23 0%, #08080a 100%);
    }

    #canvas-wrapper {
      position: relative;
      background-color: #5c94fc;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.8), 0 0 0 2px #222;
      overflow: hidden;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
    }

    /* Virtual Controls Layer */
    #touch-controls {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 50;
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      padding-left: calc(var(--safe-left) + 20px);
      padding-right: calc(var(--safe-right) + 20px);
      padding-bottom: calc(var(--safe-bottom) + 24px);
    }

    .dpad-container, .action-container {
      pointer-events: auto;
      display: flex;
      gap: 16px;
      align-items: center;
    }

    .v-btn {
      display: flex;
      justify-content: center;
      align-items: center;
      color: #fff;
      font-weight: 900;
      font-size: 20px;
      border-radius: 50%;
      background: rgba(30, 30, 30, 0.55);
      border: 3px solid rgba(255, 255, 255, 0.65);
      box-shadow: 0 6px 16px rgba(0, 0, 0, 0.5), inset 0 2px 4px rgba(255, 255, 255, 0.3);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      touch-action: none;
      transition: transform 0.06s ease, background-color 0.06s ease;
    }

    .v-btn:active, .v-btn.active {
      transform: scale(0.90);
      background: rgba(230, 50, 50, 0.75);
      border-color: #fff;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.7);
    }

    .dpad-btn {
      width: 64px;
      height: 64px;
      border-radius: 16px;
      font-size: 24px;
    }

    .action-container {
      gap: 20px;
      margin-bottom: 8px;
    }

    .action-btn {
      width: 72px;
      height: 72px;
    }

    .btn-b {
      background: rgba(220, 140, 20, 0.6);
      border-color: rgba(255, 200, 100, 0.85);
    }

    .btn-a {
      background: rgba(210, 35, 35, 0.65);
      border-color: rgba(255, 120, 120, 0.85);
      margin-top: -24px;
    }

    /* Modal / Overlay for Menus */
    .overlay-screen {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.70);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      color: #fff;
      z-index: 100;
      font-family: 'Courier New', Courier, monospace;
      text-align: center;
      padding: 20px;
      pointer-events: auto;
    }

    .overlay-title {
      font-size: 32px;
      font-weight: 900;
      color: #fcb43a;
      text-shadow: 4px 4px 0px #b81c00, -2px -2px 0 #000;
      margin-bottom: 16px;
      letter-spacing: 2px;
    }

    .overlay-subtitle {
      font-size: 16px;
      color: #fff;
      margin-bottom: 24px;
      line-height: 1.6;
      text-shadow: 2px 2px 0 #000;
    }

    .pulse-text {
      animation: blink 1.2s infinite;
      font-size: 18px;
      color: #5cff5c;
      font-weight: bold;
      text-shadow: 2px 2px 0 #000;
    }

    @keyframes blink {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.3; transform: scale(0.96); }
    }

    .overlay-btn {
      padding: 14px 28px;
      background: #e52521;
      border: 3px solid #fff;
      color: #fff;
      font-size: 18px;
      font-weight: bold;
      border-radius: 12px;
      box-shadow: 0 6px 0 #8b0000;
      cursor: pointer;
      margin-top: 10px;
      touch-action: manipulation;
    }

    .overlay-btn:active {
      transform: translateY(4px);
      box-shadow: 0 2px 0 #8b0000;
    }
  </style>
</head>
<body>
  <div id="app-container">
    <div id="canvas-wrapper">
      <canvas id="game-canvas"></canvas>

      <!-- UI Overlays -->
      <div id="start-overlay" class="overlay-screen">
        <div class="overlay-title">SUPER MARIO BROS</div>
        <div class="overlay-subtitle">
          iPad RETRO 2D PLATFORMER<br><br>
          [LEFT / RIGHT] MOVE &bull; [B] DASH &bull; [A] JUMP<br>
          KEYBOARD: [A / D] MOVE &bull; [J / Z] RUN &bull; [K / X / SPACE] JUMP
        </div>
        <div class="pulse-text">&#x25B6; TAP SCREEN OR PRESS ANY KEY &#x25C0;</div>
      </div>

      <div id="gameover-overlay" class="overlay-screen" style="display: none;">
        <div class="overlay-title" style="color: #ff3b30;">GAME OVER</div>
        <div class="overlay-subtitle" id="gameover-stats">SCORE: 000000</div>
        <button class="overlay-btn" id="btn-restart">PLAY AGAIN</button>
      </div>

      <div id="clear-overlay" class="overlay-screen" style="display: none;">
        <div class="overlay-title" style="color: #ffd700;">STAGE CLEAR!</div>
        <div class="overlay-subtitle" id="clear-stats">
          CONGRATULATIONS MARIO!<br><br>
          SCORE: 000000<br>
          TIME BONUS: 0
        </div>
        <button class="overlay-btn" id="btn-replay">PLAY AGAIN</button>
      </div>
    </div>

    <!-- On-screen Multi-touch Controls -->
    <div id="touch-controls">
      <div class="dpad-container">
        <div class="v-btn dpad-btn" id="btn-left">&#x25C0;</div>
        <div class="v-btn dpad-btn" id="btn-right">&#x25B6;</div>
      </div>
      <div class="action-container">
        <div class="v-btn action-btn btn-b" id="btn-b">B</div>
        <div class="v-btn action-btn btn-a" id="btn-a">A</div>
      </div>
    </div>
  </div>

  <script>
    /* ==========================================================================
       1. RETRO 8-BIT SOUND SYNTHESIZER (Web Audio API)
       ========================================================================== */
    class RetroAudioEngine {
      constructor() {
        this.ctx = null;
        this.masterGain = null;
      }

      init() {
        if (this.ctx) return;
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        if (!AudioCtx) return;
        this.ctx = new AudioCtx();
        this.masterGain = this.ctx.createGain();
        this.masterGain.gain.setValueAtTime(0.25, this.ctx.currentTime);
        this.masterGain.connect(this.ctx.destination);
      }

      unlock() {
        this.init();
        if (this.ctx && this.ctx.state === 'suspended') {
          this.ctx.resume();
        }
      }

      playJump() {
        if (!this.ctx) return;
        const now = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'square';
        osc.frequency.setValueAtTime(140, now);
        osc.frequency.exponentialRampToValueAtTime(580, now + 0.16);
        gain.gain.setValueAtTime(0.35, now);
        gain.gain.linearRampToValueAtTime(0.01, now + 0.16);
        osc.connect(gain);
        gain.connect(this.masterGain);
        osc.start(now);
        osc.stop(now + 0.16);
      }

      playCoin() {
        if (!this.ctx) return;
        const now = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(987.77, now); // B5
        osc.frequency.setValueAtTime(1318.51, now + 0.08); // E6
        gain.gain.setValueAtTime(0.4, now);
        gain.gain.linearRampToValueAtTime(0.4, now + 0.26);
        gain.gain.linearRampToValueAtTime(0.01, now + 0.32);
        osc.connect(gain);
        gain.connect(this.masterGain);
        osc.start(now);
        osc.stop(now + 0.32);
      }

      playBump() {
        if (!this.ctx) return;
        const now = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(120, now);
        osc.frequency.linearRampToValueAtTime(60, now + 0.1);
        gain.gain.setValueAtTime(0.5, now);
        gain.gain.linearRampToValueAtTime(0.01, now + 0.1);
        osc.connect(gain);
        gain.connect(this.masterGain);
        osc.start(now);
        osc.stop(now + 0.1);
      }

      playBreak() {
        if (!this.ctx) return;
        const now = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(260, now);
        osc.frequency.exponentialRampToValueAtTime(40, now + 0.18);
        gain.gain.setValueAtTime(0.4, now);
        gain.gain.linearRampToValueAtTime(0.01, now + 0.18);
        osc.connect(gain);
        gain.connect(this.masterGain);
        osc.start(now);
        osc.stop(now + 0.18);
      }

      playStomp() {
        if (!this.ctx) return;
        const now = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'square';
        osc.frequency.setValueAtTime(180, now);
        osc.frequency.exponentialRampToValueAtTime(45, now + 0.12);
        gain.gain.setValueAtTime(0.45, now);
        gain.gain.linearRampToValueAtTime(0.01, now + 0.12);
        osc.connect(gain);
        gain.connect(this.masterGain);
        osc.start(now);
        osc.stop(now + 0.12);
      }

      playDie() {
        if (!this.ctx) return;
        const now = this.ctx.currentTime;
        const notes = [493.88, 466.16, 440.0, 392.0, 329.63, 261.63];
        notes.forEach((freq, idx) => {
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          const start = now + (idx * 0.12);
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(freq, start);
          gain.gain.setValueAtTime(0.4, start);
          gain.gain.linearRampToValueAtTime(0.01, start + 0.11);
          osc.connect(gain);
          gain.connect(this.masterGain);
          osc.start(start);
          osc.stop(start + 0.12);
        });
      }

      playFlagSlide() {
        if (!this.ctx) return;
        const now = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(800, now);
        osc.frequency.linearRampToValueAtTime(180, now + 1.2);
        gain.gain.setValueAtTime(0.25, now);
        gain.gain.linearRampToValueAtTime(0.01, now + 1.2);
        osc.connect(gain);
        gain.connect(this.masterGain);
        osc.start(now);
        osc.stop(now + 1.2);
      }

      playWinFanfare() {
        if (!this.ctx) return;
        const now = this.ctx.currentTime;
        const notes = [
          { f: 392.00, d: 0.12 },
          { f: 523.25, d: 0.12 },
          { f: 659.25, d: 0.12 },
          { f: 783.99, d: 0.20 },
          { f: 659.25, d: 0.12 },
          { f: 783.99, d: 0.45 }
        ];
        let t = now;
        notes.forEach(n => {
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'square';
          osc.frequency.setValueAtTime(n.f, t);
          gain.gain.setValueAtTime(0.35, t);
          gain.gain.linearRampToValueAtTime(0.01, t + n.d - 0.02);
          osc.connect(gain);
          gain.connect(this.masterGain);
          osc.start(t);
          osc.stop(t + n.d);
          t += n.d;
        });
      }
    }

    const soundEngine = new RetroAudioEngine();

    /* ==========================================================================
       2. CONSTANTS & TILE ENUMS
       ========================================================================== */
    const TILE_SIZE = 16;
    const CANVAS_WIDTH = 256;
    const CANVAS_HEIGHT = 224;

    const TILE_AIR = 0;
    const TILE_GROUND = 1;
    const TILE_BRICK = 2;
    const TILE_Q_COIN = 3;
    const TILE_EMPTY = 4;
    const TILE_PIPE_TL = 5;
    const TILE_PIPE_TR = 6;
    const TILE_PIPE_BL = 7;
    const TILE_PIPE_BR = 8;
    const TILE_FLAG_POLE = 9;
    const TILE_FLAG_TOP = 10;
    const TILE_CASTLE_BRICK = 11;
    const TILE_CASTLE_TOP = 12; // Merlon 'M'
    const TILE_CASTLE_DOOR = 13;
    const TILE_COIN = 14;       // Ground/Air Collectible Coin 'O'

    const GAME_STATES = {
      START: 'START',
      PLAYING: 'PLAYING',
      FLAG_SLIDE: 'FLAG_SLIDE',
      WALK_TO_CASTLE: 'WALK_TO_CASTLE',
      CLEAR: 'CLEAR',
      GAMEOVER: 'GAMEOVER'
    };

    /* ==========================================================================
       3. LEVEL BLUEPRINT (Classic 1-1 layout, Flagpole & Castle)
       ========================================================================== */
    const LEVEL_MAP_SOURCE = [
      "                                                                                 ",
      "                                                                                 ",
      "                                                                                 ",
      "                                                                                 ",
      "                                                                                 ",
      "                                                                                 ",
      "                                                                                 ",
      "                                                                                 ",
      "                                                                                 ",
      "               ?                                       T                         ",
      "                                                       |                         ",
      "                                                       |                         ",
      "             B?B?B         O O O                       |     M M M               ",
      "                                                       |     CCCCC               ",
      "                            []                         |     CCCCC               ",
      "                    []      {}                         |     CCXCC               ",
      "GGGGGGGGGGGGGGGGGG  GGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGG",
      "GGGGGGGGGGGGGGGGGG  GGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGG"
    ];

    /* ==========================================================================
       4. INPUT MANAGER (Multi-Touch & Keyboard)
       ========================================================================== */
    class InputManager {
      constructor() {
        this.keys = { left: false, right: false, up: false, down: false, b: false, a: false };
        this.prevA = false;
        this.touchPointers = new Map();
        this.setupKeyboard();
        this.setupTouch();
      }

      setupKeyboard() {
        window.addEventListener('keydown', (e) => {
          soundEngine.unlock();
          if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', ' '].includes(e.key)) {
            e.preventDefault();
          }
          this.handleKey(e.code, true);
        });

        window.addEventListener('keyup', (e) => {
          this.handleKey(e.code, false);
        });
      }

      handleKey(code, isPressed) {
        switch (code) {
          case 'ArrowLeft':
          case 'KeyA':
            this.keys.left = isPressed;
            break;
          case 'ArrowRight':
          case 'KeyD':
            this.keys.right = isPressed;
            break;
          case 'ArrowUp':
          case 'KeyW':
            this.keys.up = isPressed;
            break;
          case 'ArrowDown':
          case 'KeyS':
            this.keys.down = isPressed;
            break;
          case 'KeyZ':
          case 'KeyJ':
          case 'ShiftLeft':
          case 'ShiftRight':
            this.keys.b = isPressed;
            break;
          case 'KeyX':
          case 'KeyK':
          case 'Space':
            this.keys.a = isPressed;
            break;
        }
      }

      setupTouch() {
        const bindBtn = (id, keyName) => {
          const el = document.getElementById(id);
          if (!el) return;

          const onStart = (e) => {
            e.preventDefault();
            soundEngine.unlock();
            for (let i = 0; i < e.changedTouches.length; i++) {
              const t = e.changedTouches[i];
              this.touchPointers.set(t.identifier, keyName);
            }
            this.keys[keyName] = true;
            el.classList.add('active');
          };

          const onEnd = (e) => {
            e.preventDefault();
            for (let i = 0; i < e.changedTouches.length; i++) {
              const t = e.changedTouches[i];
              this.touchPointers.delete(t.identifier);
            }
            let stillPressed = false;
            for (let val of this.touchPointers.values()) {
              if (val === keyName) stillPressed = true;
            }
            if (!stillPressed) {
              this.keys[keyName] = false;
              el.classList.remove('active');
            }
          };

          el.addEventListener('touchstart', onStart, { passive: false });
          el.addEventListener('touchend', onEnd, { passive: false });
          el.addEventListener('touchcancel', onEnd, { passive: false });
        };

        bindBtn('btn-left', 'left');
        bindBtn('btn-right', 'right');
        bindBtn('btn-b', 'b');
        bindBtn('btn-a', 'a');
      }

      isJumpJustPressed() {
        return this.keys.a && !this.prevA;
      }

      update() {
        this.prevA = this.keys.a;
      }
    }

    /* ==========================================================================
       5. LEVEL & TILEMAP SYSTEM
       ========================================================================== */
    class Level {
      constructor() {
        this.height = LEVEL_MAP_SOURCE.length;
        this.width = LEVEL_MAP_SOURCE[0].length;
        this.tiles = [];
        this.flagX = 55 * TILE_SIZE;
        this.flagTopY = 9 * TILE_SIZE;
        this.flagBottomY = 15 * TILE_SIZE;
        this.castleDoorX = 70 * TILE_SIZE;
        this.load();
      }

      load() {
        this.tiles = [];
        for (let r = 0; r < this.height; r++) {
          const row = [];
          for (let c = 0; c < this.width; c++) {
            const ch = LEVEL_MAP_SOURCE[r][c] || ' ';
            switch (ch) {
              case 'G': row.push(TILE_GROUND); break;
              case 'B': row.push(TILE_BRICK); break;
              case '?': row.push(TILE_Q_COIN); break;
              case 'O': row.push(TILE_COIN); break;
              case '[': row.push(TILE_PIPE_TL); break;
              case ']': row.push(TILE_PIPE_TR); break;
              case '{': row.push(TILE_PIPE_BL); break;
              case '}': row.push(TILE_PIPE_BR); break;
              case 'T':
                row.push(TILE_FLAG_TOP);
                this.flagX = c * TILE_SIZE;
                this.flagTopY = r * TILE_SIZE;
                break;
              case '|':
                row.push(TILE_FLAG_POLE);
                this.flagBottomY = (r + 1) * TILE_SIZE;
                break;
              case 'C': row.push(TILE_CASTLE_BRICK); break;
              case 'M': row.push(TILE_CASTLE_TOP); break;
              case 'X':
                row.push(TILE_CASTLE_DOOR);
                this.castleDoorX = c * TILE_SIZE + 6;
                break;
              default: row.push(TILE_AIR); break;
            }
          }
          this.tiles.push(row);
        }
      }

      getTile(tx, ty) {
        if (tx < 0 || tx >= this.width || ty < 0 || ty >= this.height) return TILE_AIR;
        return this.tiles[ty][tx];
      }

      setTile(tx, ty, val) {
        if (tx >= 0 && tx < this.width && ty >= 0 && ty < this.height) {
          this.tiles[ty][tx] = val;
        }
      }

      isSolid(tile) {
        return (
          tile === TILE_GROUND ||
          tile === TILE_BRICK ||
          tile === TILE_Q_COIN ||
          tile === TILE_EMPTY ||
          tile === TILE_PIPE_TL ||
          tile === TILE_PIPE_TR ||
          tile === TILE_PIPE_BL ||
          tile === TILE_PIPE_BR
          // Castle bricks and door are background decorations, not blocking solid tiles
        );
      }
    }

    /* ==========================================================================
       6. PARTICLES & FLOATING TEXTS
       ========================================================================== */
    class Particle {
      constructor(x, y, vx, vy, type, text = '') {
        this.x = x;
        this.y = y;
        this.vx = vx;
        this.vy = vy;
        this.type = type; // 'brick', 'coin', 'score'
        this.life = 60;
        this.text = text;
        this.frame = 0;
      }

      update() {
        this.life--;
        this.frame++;
        this.x += this.vx;
        this.y += this.vy;
        if (this.type === 'brick') {
          this.vy += 0.45;
        } else if (this.type === 'coin') {
          this.vy += 0.35;
        } else if (this.type === 'score') {
          this.vy *= 0.95;
        }
      }

      draw(ctx, camX) {
        const rx = Math.round(this.x - camX);
        const ry = Math.round(this.y);

        if (this.type === 'brick') {
          ctx.fillStyle = '#b84418';
          ctx.fillRect(rx, ry, 6, 6);
          ctx.fillStyle = '#fce4a0';
          ctx.fillRect(rx, ry, 2, 2);
        } else if (this.type === 'coin') {
          ctx.fillStyle = '#fcb43a';
          ctx.fillRect(rx + 2, ry, 8, 12);
          ctx.fillStyle = '#fff';
          ctx.fillRect(rx + 4, ry + 2, 4, 8);
        } else if (this.type === 'score') {
          ctx.fillStyle = '#ffffff';
          ctx.font = '8px monospace';
          ctx.fillText(this.text, rx, ry);
        }
      }
    }

    /* ==========================================================================
       7. GOOMBA ENEMY AI
       ========================================================================== */
    class Goomba {
      constructor(x, y) {
        this.x = x;
        this.y = y;
        this.w = 14;
        this.h = 14;
        this.vx = -0.5;
        this.vy = 0;
        this.dead = false;
        this.flat = false;
        this.flatTimer = 0;
        this.animTimer = 0;
      }

      update(level) {
        if (this.dead) return;

        if (this.flat) {
          this.flatTimer--;
          if (this.flatTimer <= 0) {
            this.dead = true;
          }
          return;
        }

        this.animTimer++;
        this.vy += 0.35;
        if (this.vy > 6) this.vy = 6;

        // X Movement & Collision
        this.x += this.vx;
        const txLeft = Math.floor(this.x / TILE_SIZE);
        const txRight = Math.floor((this.x + this.w) / TILE_SIZE);
        const tyTop = Math.floor(this.y / TILE_SIZE);
        const tyBottom = Math.floor((this.y + this.h - 1) / TILE_SIZE);

        if (this.vx < 0) {
          if (level.isSolid(level.getTile(txLeft, tyTop)) || level.isSolid(level.getTile(txLeft, tyBottom))) {
            this.x = (txLeft + 1) * TILE_SIZE;
            this.vx = -this.vx;
          }
        } else {
          if (level.isSolid(level.getTile(txRight, tyTop)) || level.isSolid(level.getTile(txRight, tyBottom))) {
            this.x = txRight * TILE_SIZE - this.w;
            this.vx = -this.vx;
          }
        }

        // Y Movement & Collision
        this.y += this.vy;
        const ntyBottom = Math.floor((this.y + this.h) / TILE_SIZE);
        const curTxL = Math.floor((this.x + 2) / TILE_SIZE);
        const curTxR = Math.floor((this.x + this.w - 2) / TILE_SIZE);

        if (level.isSolid(level.getTile(curTxL, ntyBottom)) || level.isSolid(level.getTile(curTxR, ntyBottom))) {
          this.y = ntyBottom * TILE_SIZE - this.h;
          this.vy = 0;
        }

        if (this.y > CANVAS_HEIGHT + 32) {
          this.dead = true;
        }
      }

      stomp() {
        this.flat = true;
        this.flatTimer = 35;
        this.vx = 0;
        this.vy = 0;
      }

      draw(ctx, camX) {
        if (this.dead) return;
        const rx = Math.round(this.x - camX);
        const ry = Math.round(this.y);

        if (this.flat) {
          ctx.fillStyle = '#a84200';
          ctx.fillRect(rx, ry + 8, 16, 6);
          ctx.fillStyle = '#000';
          ctx.fillRect(rx + 3, ry + 10, 3, 2);
          ctx.fillRect(rx + 10, ry + 10, 3, 2);
          return;
        }

        ctx.fillStyle = '#a84200';
        ctx.fillRect(rx + 2, ry, 12, 10);
        ctx.fillRect(rx, ry + 3, 16, 7);

        ctx.fillStyle = '#fff';
        ctx.fillRect(rx + 3, ry + 5, 3, 4);
        ctx.fillRect(rx + 10, ry + 5, 3, 4);
        ctx.fillStyle = '#000';
        ctx.fillRect(rx + 4, ry + 6, 2, 3);
        ctx.fillRect(rx + 10, ry + 6, 2, 3);

        ctx.fillStyle = '#000';
        const step = Math.floor(this.animTimer / 10) % 2;
        if (step === 0) {
          ctx.fillRect(rx, ry + 11, 5, 4);
          ctx.fillRect(rx + 10, ry + 10, 5, 3);
        } else {
          ctx.fillRect(rx + 1, ry + 10, 5, 3);
          ctx.fillRect(rx + 11, ry + 11, 5, 4);
        }
      }
    }

    /* ==========================================================================
       8. MARIO PLAYER CLASS
       ========================================================================== */
    class Player {
      constructor(x, y) {
        this.startX = x;
        this.startY = y;
        this.reset();
      }

      reset() {
        this.x = this.startX;
        this.y = this.startY;
        this.w = 12;
        this.h = 15;
        this.vx = 0;
        this.vy = 0;
        this.facing = 1;
        this.grounded = false;
        this.isJumping = false;
        this.isSkidding = false;
        this.animTimer = 0;

        this.ACCEL = 0.085;
        this.RUN_ACCEL = 0.13;
        this.MAX_WALK_SPEED = 1.6;
        this.MAX_RUN_SPEED = 2.6;
        this.FRICTION = 0.88;
        this.SKID_FRICTION = 0.75;
        this.GRAVITY = 0.38;
        this.FALL_GRAVITY = 0.52;
        this.JUMP_FORCE = -5.8;
        this.TERMINAL_VEL = 7.5;

        this.isDying = false;
        this.dieTimer = 0;
        this.flagSliding = false;
        this.walkingToCastle = false;
        this.hidden = false;
      }

      kill() {
        if (this.isDying) return;
        this.isDying = true;
        this.dieTimer = 0;
        this.vx = 0;
        this.vy = -7.5;
        this.flagSliding = false;
        this.walkingToCastle = false;
        soundEngine.playDie();
      }

      update(input, level, particles, onBlockHit, onCollectCoin) {
        if (this.hidden) return;

        // Death Sequence
        if (this.isDying) {
          this.dieTimer++;
          if (this.dieTimer > 20) {
            this.vy += 0.35;
            this.y += this.vy;
          }
          return;
        }

        // Flagpole Slide Animation
        if (this.flagSliding) {
          this.facing = -1; // Face pole while sliding
          this.vy = 2.0;
          this.y += this.vy;
          if (this.y >= level.flagBottomY - this.h) {
            this.y = level.flagBottomY - this.h;
            // Mario reached bottom, wait for flag in MarioGame.update
          }
          return;
        }

        // Walking towards Castle
        if (this.walkingToCastle) {
          this.facing = 1;
          this.vx = 1.1;
          this.x += this.vx;
          this.animTimer += 0.3;
          this.vy += this.GRAVITY;
          this.y += this.vy;
          const ty = Math.floor((this.y + this.h) / TILE_SIZE);
          const tx1 = Math.floor((this.x + 2) / TILE_SIZE);
          const tx2 = Math.floor((this.x + this.w - 2) / TILE_SIZE);
          if (level.isSolid(level.getTile(tx1, ty)) || level.isSolid(level.getTile(tx2, ty))) {
            this.y = ty * TILE_SIZE - this.h;
            this.vy = 0;
            this.grounded = true;
          }
          if (this.x >= level.castleDoorX) {
            this.hidden = true;
          }
          return;
        }

        // Normal Movement
        const isDash = input.keys.b;
        const maxSpeed = isDash ? this.MAX_RUN_SPEED : this.MAX_WALK_SPEED;
        const curAccel = isDash ? this.RUN_ACCEL : this.ACCEL;

        if (input.keys.left && !input.keys.right) {
          this.facing = -1;
          if (this.vx > 0.3) {
            this.isSkidding = true;
            this.vx *= this.SKID_FRICTION;
          } else {
            this.isSkidding = false;
            this.vx -= curAccel;
            if (this.vx < -maxSpeed) this.vx = -maxSpeed;
          }
        } else if (input.keys.right && !input.keys.left) {
          this.facing = 1;
          if (this.vx < -0.3) {
            this.isSkidding = true;
            this.vx *= this.SKID_FRICTION;
          } else {
            this.isSkidding = false;
            this.vx += curAccel;
            if (this.vx > maxSpeed) this.vx = maxSpeed;
          }
        } else {
          this.isSkidding = false;
          this.vx *= this.FRICTION;
          if (Math.abs(this.vx) < 0.05) this.vx = 0;
        }

        // Jump
        if (input.isJumpJustPressed() && this.grounded) {
          this.vy = this.JUMP_FORCE;
          this.grounded = false;
          this.isJumping = true;
          soundEngine.playJump();
        }

        if (this.isJumping) {
          if (!input.keys.a && this.vy < -2.2) {
            this.vy = -2.2;
          }
          if (this.vy >= 0) {
            this.isJumping = false;
          }
        }

        const g = (this.vy > 0) ? this.FALL_GRAVITY : this.GRAVITY;
        this.vy += g;
        if (this.vy > this.TERMINAL_VEL) this.vy = this.TERMINAL_VEL;

        // --- Consistent AABB Collision Resolution ---
        // Horizontal Movement & Collision (inward Y margins 2px to avoid ground snagging)
        this.x += this.vx;
        if (this.x < 0) {
          this.x = 0;
          this.vx = 0;
        }

        let ltx = Math.floor(this.x / TILE_SIZE);
        let rtx = Math.floor((this.x + this.w - 1) / TILE_SIZE);
        let tty = Math.floor((this.y + 2) / TILE_SIZE);
        let bty = Math.floor((this.y + this.h - 3) / TILE_SIZE);

        if (this.vx < 0) {
          if (level.isSolid(level.getTile(ltx, tty)) || level.isSolid(level.getTile(ltx, bty))) {
            this.x = (ltx + 1) * TILE_SIZE;
            this.vx = 0;
          }
        } else if (this.vx > 0) {
          if (level.isSolid(level.getTile(rtx, tty)) || level.isSolid(level.getTile(rtx, bty))) {
            this.x = rtx * TILE_SIZE - this.w;
            this.vx = 0;
          }
        }

        // Vertical Movement & Collision (inward X margins 1px)
        this.y += this.vy;
        ltx = Math.floor((this.x + 1) / TILE_SIZE);
        rtx = Math.floor((this.x + this.w - 2) / TILE_SIZE);
        tty = Math.floor(this.y / TILE_SIZE);
        bty = Math.floor((this.y + this.h) / TILE_SIZE);

        if (this.vy > 0) {
          if (level.isSolid(level.getTile(ltx, bty)) || level.isSolid(level.getTile(rtx, bty))) {
            this.y = bty * TILE_SIZE - this.h;
            this.vy = 0;
            this.grounded = true;
          } else {
            this.grounded = false;
          }
        } else if (this.vy < 0) {
          const hitTileL = level.getTile(ltx, tty);
          const hitTileR = level.getTile(rtx, tty);

          if (level.isSolid(hitTileL) || level.isSolid(hitTileR)) {
            this.y = (tty + 1) * TILE_SIZE;
            this.vy = 0;
            const targetTx = level.isSolid(hitTileL) ? ltx : rtx;
            onBlockHit(targetTx, tty);
          }
        }

        // Collectible Coins overlapping check
        const curTx1 = Math.floor(this.x / TILE_SIZE);
        const curTx2 = Math.floor((this.x + this.w) / TILE_SIZE);
        const curTy1 = Math.floor(this.y / TILE_SIZE);
        const curTy2 = Math.floor((this.y + this.h) / TILE_SIZE);

        for (let r = curTy1; r <= curTy2; r++) {
          for (let c = curTx1; c <= curTx2; c++) {
            if (level.getTile(c, r) === TILE_COIN) {
              level.setTile(c, r, TILE_AIR);
              onCollectCoin(c, r);
            }
          }
        }

        // Pit Death
        if (this.y > CANVAS_HEIGHT + 20) {
          this.kill();
        }

        if (this.grounded && Math.abs(this.vx) > 0.1) {
          this.animTimer += Math.abs(this.vx) * 0.35;
        }
      }

      draw(ctx, camX) {
        if (this.hidden) return;
        const rx = Math.round(this.x - camX);
        const ry = Math.round(this.y);

        ctx.save();
        if (this.facing === -1) {
          ctx.translate(rx + this.w, ry);
          ctx.scale(-1, 1);
        } else {
          ctx.translate(rx, ry);
        }

        if (this.isDying) {
          ctx.fillStyle = '#b81c00';
          ctx.fillRect(2, 0, 8, 4);
          ctx.fillStyle = '#fc9838';
          ctx.fillRect(2, 4, 8, 5);
          ctx.fillStyle = '#0028a0';
          ctx.fillRect(1, 9, 10, 6);
          ctx.restore();
          return;
        }

        // Red Cap
        ctx.fillStyle = '#e52521';
        ctx.fillRect(3, 0, 6, 2);
        ctx.fillRect(2, 2, 9, 2);

        // Face & Hair
        ctx.fillStyle = '#fc9838';
        ctx.fillRect(2, 4, 7, 3);
        ctx.fillStyle = '#6b4000';
        ctx.fillRect(1, 4, 2, 3);
        ctx.fillRect(6, 4, 2, 2);

        // Moustache
        ctx.fillStyle = '#000';
        ctx.fillRect(5, 6, 4, 1);

        // Overalls & Shirt
        ctx.fillStyle = '#0038b8';
        ctx.fillRect(2, 7, 8, 5);
        ctx.fillStyle = '#e52521';
        ctx.fillRect(1, 7, 2, 3);
        ctx.fillRect(9, 7, 2, 3);
        ctx.fillStyle = '#fcd800';
        ctx.fillRect(3, 9, 1, 1);
        ctx.fillRect(7, 9, 1, 1);

        // Shoes & Animation
        ctx.fillStyle = '#6b4000';
        if (this.flagSliding) {
          ctx.fillRect(1, 12, 5, 3);
          ctx.fillRect(7, 12, 4, 3);
        } else if (!this.grounded) {
          ctx.fillRect(0, 12, 4, 3);
          ctx.fillRect(7, 11, 4, 3);
        } else if (this.isSkidding) {
          ctx.fillRect(1, 12, 4, 3);
          ctx.fillRect(8, 12, 4, 3);
        } else if (Math.abs(this.vx) > 0.1) {
          const f = Math.floor(this.animTimer) % 3;
          if (f === 0) {
            ctx.fillRect(0, 12, 4, 3);
            ctx.fillRect(7, 12, 4, 3);
          } else if (f === 1) {
            ctx.fillRect(2, 12, 4, 3);
            ctx.fillRect(6, 12, 4, 3);
          } else {
            ctx.fillRect(3, 12, 4, 3);
            ctx.fillRect(5, 11, 4, 3);
          }
        } else {
          ctx.fillRect(1, 12, 4, 3);
          ctx.fillRect(7, 12, 4, 3);
        }

        ctx.restore();
      }
    }

    /* ==========================================================================
       9. MAIN GAME ENGINE
       ========================================================================== */
    class MarioGame {
      constructor() {
        this.canvas = document.getElementById('game-canvas');
        this.ctx = this.canvas.getContext('2d', { alpha: false });
        this.canvas.width = CANVAS_WIDTH;
        this.canvas.height = CANVAS_HEIGHT;
        this.ctx.imageSmoothingEnabled = false;

        this.input = new InputManager();
        this.level = new Level();
        this.player = new Player(40, 100);

        this.enemies = [];
        this.particles = [];
        this.camX = 0;

        // HUD & Stats
        this.score = 0;
        this.coins = 0;
        this.time = 400;
        this.timeTick = 0;
        this.state = GAME_STATES.START;

        // Flag Animation state
        this.flagY = this.level.flagTopY + 4;
        this.flagTargetY = this.level.flagBottomY - 14;

        this.initDOM();
        this.handleResize();
        window.addEventListener('resize', () => this.handleResize());

        this.resetWorld();
        requestAnimationFrame((t) => this.loop(t));
      }

      initDOM() {
        const startOverlay = document.getElementById('start-overlay');
        const gameoverOverlay = document.getElementById('gameover-overlay');
        const clearOverlay = document.getElementById('clear-overlay');

        const startGame = (e) => {
          if (e) e.preventDefault();
          soundEngine.unlock();
          if (this.state === GAME_STATES.START) {
            this.state = GAME_STATES.PLAYING;
            startOverlay.style.display = 'none';
          }
        };

        startOverlay.addEventListener('click', startGame);
        startOverlay.addEventListener('touchstart', startGame, { passive: false });
        window.addEventListener('keydown', () => {
          if (this.state === GAME_STATES.START) startGame();
        });

        const restartGame = (e) => {
          if (e) e.preventDefault();
          soundEngine.unlock();
          this.resetWorld();
          gameoverOverlay.style.display = 'none';
          this.state = GAME_STATES.PLAYING;
        };

        const replayGame = (e) => {
          if (e) e.preventDefault();
          soundEngine.unlock();
          this.resetWorld();
          clearOverlay.style.display = 'none';
          this.state = GAME_STATES.PLAYING;
        };

        const btnRestart = document.getElementById('btn-restart');
        btnRestart.addEventListener('click', restartGame);
        btnRestart.addEventListener('touchstart', restartGame, { passive: false });

        const btnReplay = document.getElementById('btn-replay');
        btnReplay.addEventListener('click', replayGame);
        btnReplay.addEventListener('touchstart', replayGame, { passive: false });
      }

      handleResize() {
        const wrapper = document.getElementById('canvas-wrapper');
        const winW = window.innerWidth;
        const winH = window.innerHeight;
        const targetRatio = CANVAS_WIDTH / CANVAS_HEIGHT;
        let w = winW;
        let h = winW / targetRatio;

        if (h > winH) {
          h = winH;
          w = winH * targetRatio;
        }

        wrapper.style.width = `${Math.floor(w)}px`;
        wrapper.style.height = `${Math.floor(h)}px`;
      }

      resetWorld() {
        this.level.load();
        this.player.reset();
        this.score = 0;
        this.coins = 0;
        this.time = 400;
        this.timeTick = 0;
        this.camX = 0;
        this.flagY = this.level.flagTopY + 4;
        this.flagTargetY = this.level.flagBottomY - 14;

        this.enemies = [
          new Goomba(22 * TILE_SIZE, 12 * TILE_SIZE),
          new Goomba(38 * TILE_SIZE, 12 * TILE_SIZE),
          new Goomba(41 * TILE_SIZE, 12 * TILE_SIZE),
          new Goomba(52 * TILE_SIZE, 12 * TILE_SIZE)
        ];
        this.particles = [];
      }

      onBlockHit(tx, ty) {
        const tile = this.level.getTile(tx, ty);
        if (tile === TILE_Q_COIN) {
          this.level.setTile(tx, ty, TILE_EMPTY);
          this.coins++;
          this.score += 200;
          soundEngine.playCoin();
          this.particles.push(new Particle(tx * TILE_SIZE + 2, (ty - 1) * TILE_SIZE, 0, -4.5, 'coin'));
          this.particles.push(new Particle(tx * TILE_SIZE + 2, (ty - 1) * TILE_SIZE, 0, -1.2, 'score', '200'));
        } else if (tile === TILE_BRICK) {
          this.level.setTile(tx, ty, TILE_AIR);
          this.score += 50;
          soundEngine.playBreak();
          const bx = tx * TILE_SIZE;
          const by = ty * TILE_SIZE;
          this.particles.push(new Particle(bx, by, -1.8, -4.5, 'brick'));
          this.particles.push(new Particle(bx + 8, by, 1.8, -4.5, 'brick'));
          this.particles.push(new Particle(bx, by + 8, -1.2, -2.5, 'brick'));
          this.particles.push(new Particle(bx + 8, by + 8, 1.2, -2.5, 'brick'));
        } else {
          soundEngine.playBump();
        }
      }

      onCollectCoin(tx, ty) {
        this.coins++;
        this.score += 200;
        soundEngine.playCoin();
        this.particles.push(new Particle(tx * TILE_SIZE + 2, ty * TILE_SIZE - 4, 0, -1.2, 'score', '200'));
      }

      checkGoombaCollisions() {
        if (this.player.isDying || this.player.flagSliding || this.player.walkingToCastle) return;

        const p = this.player;
        const px2 = p.x + p.w;
        const py2 = p.y + p.h;

        for (let enemy of this.enemies) {
          if (enemy.dead || enemy.flat) continue;
          const ex2 = enemy.x + enemy.w;
          const ey2 = enemy.y + enemy.h;

          if (p.x < ex2 && px2 > enemy.x && p.y < ey2 && py2 > enemy.y) {
            if (p.vy > 0 && py2 - p.vy <= enemy.y + 6) {
              enemy.stomp();
              p.vy = -4.8;
              this.score += 100;
              soundEngine.playStomp();
              this.particles.push(new Particle(enemy.x, enemy.y - 6, 0, -1, 'score', '100'));
            } else {
              p.kill();
            }
          }
        }
      }

      checkFlagpoleCollision() {
        if (this.state !== GAME_STATES.PLAYING) return;
        if (this.player.isDying) return; // Prevent dead player from sliding flag

        const p = this.player;
        const poleX = this.level.flagX;
        const poleBottom = this.level.flagBottomY;

        // Upward unbounded flag collision prevents jumping over flagpole
        if (p.x + p.w >= poleX + 4 && p.x <= poleX + 12 && p.y + p.h >= 0 && p.y <= poleBottom) {
          this.state = GAME_STATES.FLAG_SLIDE;
          p.flagSliding = true;
          p.vx = 0;
          p.x = poleX - 4;

          const relativeHeight = (poleBottom - p.y);
          let flagPoints = 100;
          if (relativeHeight > 80) flagPoints = 5000;
          else if (relativeHeight > 60) flagPoints = 2000;
          else if (relativeHeight > 35) flagPoints = 800;
          else if (relativeHeight > 15) flagPoints = 400;

          this.score += flagPoints;
          this.particles.push(new Particle(poleX - 8, Math.max(p.y, 40), 0, -1.2, 'score', `${flagPoints}`));
          soundEngine.playFlagSlide();
        }
      }

      update() {
        this.input.update();

        if (this.state === GAME_STATES.PLAYING) {
          // Freeze countdown and enemy updates during death animation
          if (!this.player.isDying) {
            this.timeTick++;
            if (this.timeTick >= 60) {
              this.timeTick = 0;
              this.time--;
              if (this.time <= 0) {
                this.time = 0;
                this.player.kill();
              }
            }

            for (let enemy of this.enemies) {
              enemy.update(this.level);
            }
          }

          this.player.update(
            this.input,
            this.level,
            this.particles,
            (tx, ty) => this.onBlockHit(tx, ty),
            (tx, ty) => this.onCollectCoin(tx, ty)
          );

          this.checkGoombaCollisions();
          this.checkFlagpoleCollision();

          const targetCamX = this.player.x - CANVAS_WIDTH * 0.38;
          if (targetCamX > this.camX) {
            this.camX += (targetCamX - this.camX) * 0.1;
          }
          const maxCamX = (this.level.width * TILE_SIZE) - CANVAS_WIDTH;
          if (this.camX > maxCamX) this.camX = maxCamX;
          if (this.camX < 0) this.camX = 0;

          if (this.player.isDying && this.player.y > CANVAS_HEIGHT + 30) {
            this.state = GAME_STATES.GAMEOVER;
            document.getElementById('gameover-stats').innerText = `SCORE: ${String(this.score).padStart(6, '0')}`;
            document.getElementById('gameover-overlay').style.display = 'flex';
          }
        } else if (this.state === GAME_STATES.FLAG_SLIDE) {
          this.player.update(this.input, this.level, this.particles, () => {}, () => {});

          if (this.flagY < this.flagTargetY) {
            this.flagY += 2.0;
            if (this.flagY >= this.flagTargetY) this.flagY = this.flagTargetY;
          }

          // Both Mario and Flag must hit the bottom before proceeding
          const marioAtBottom = this.player.y >= (this.level.flagBottomY - this.player.h);
          const flagAtBottom = this.flagY >= this.flagTargetY;

          if (marioAtBottom && flagAtBottom) {
            this.player.flagSliding = false;
            this.player.walkingToCastle = true;
            this.player.x = this.level.flagX + 12; // Flip to other side and walk right
            this.state = GAME_STATES.WALK_TO_CASTLE;
          }
        } else if (this.state === GAME_STATES.WALK_TO_CASTLE) {
          this.player.update(this.input, this.level, this.particles, () => {}, () => {});

          // Smooth Camera tracking to keep Castle entrance visible
          const targetCamX = this.player.x - CANVAS_WIDTH * 0.38;
          if (targetCamX > this.camX) {
            this.camX += (targetCamX - this.camX) * 0.1;
          }
          const maxCamX = (this.level.width * TILE_SIZE) - CANVAS_WIDTH;
          if (this.camX > maxCamX) this.camX = maxCamX;

          if (this.player.hidden) {
            this.state = GAME_STATES.CLEAR;
            soundEngine.playWinFanfare();

            const timeBonus = this.time * 50;
            this.score += timeBonus;
            const clearStats = document.getElementById('clear-stats');
            clearStats.innerHTML = `CONGRATULATIONS MARIO!<br><br>FINAL SCORE: ${String(this.score).padStart(6, '0')}<br>TIME BONUS: ${timeBonus} (${this.time}s &times; 50)`;
            document.getElementById('clear-overlay').style.display = 'flex';
          }
        }

        // Update Particles
        for (let i = this.particles.length - 1; i >= 0; i--) {
          const p = this.particles[i];
          p.update();
          if (p.life <= 0) {
            this.particles.splice(i, 1);
          }
        }
      }

      /* ==========================================================================
         10. RENDERER & PIXEL GRAPHICS
         ========================================================================== */
      draw() {
        const ctx = this.ctx;
        ctx.fillStyle = '#5c94fc';
        ctx.fillRect(0, 0, CANVAS_WIDTH, CANVAS_HEIGHT);

        this.drawScenery(ctx, this.camX);

        const startCol = Math.floor(this.camX / TILE_SIZE);
        const endCol = startCol + Math.ceil(CANVAS_WIDTH / TILE_SIZE) + 1;

        // Base tile pass
        for (let r = 0; r < this.level.height; r++) {
          for (let c = startCol; c <= endCol; c++) {
            if (c >= this.level.width) continue;
            const tile = this.level.getTile(c, r);
            if (tile === TILE_AIR) continue;
            const tx = Math.round(c * TILE_SIZE - this.camX);
            const ty = Math.round(r * TILE_SIZE);
            this.drawTile(ctx, tile, tx, ty);
          }
        }

        this.drawFlag(ctx, this.camX);

        for (let enemy of this.enemies) {
          enemy.draw(ctx, this.camX);
        }

        // Draw Player
        this.player.draw(ctx, this.camX);

        // Foreground Castle Wall Overhang (Archway Depth Effect)
        // Redraws the door frame and top lintel over Mario so he realistically walks "inside"
        const doorCol = Math.floor(this.level.castleDoorX / TILE_SIZE);
        const doorRow = 15;
        const dtx = Math.round(doorCol * TILE_SIZE - this.camX);
        const dty = Math.round(doorRow * TILE_SIZE);
        ctx.fillStyle = '#6b6b6b';
        ctx.fillRect(dtx - 2, dty, 3, 16);     // Left door pillar
        ctx.fillRect(dtx + 15, dty, 3, 16);    // Right door pillar
        ctx.fillRect(dtx - 2, dty - 2, 20, 3); // Arch lintel

        for (let p of this.particles) {
          p.draw(ctx, this.camX);
        }

        this.drawHUD(ctx);
      }

      drawScenery(ctx, camX) {
        ctx.fillStyle = '#00a800';
        for (let h = 0; h < 6; h++) {
          const hx = (h * 240) - (camX * 0.4) % 240;
          ctx.beginPath();
          ctx.arc(hx + 30, 200, 36, Math.PI, 0, false);
          ctx.fill();
        }

        ctx.fillStyle = '#ffffff';
        for (let c = 0; c < 5; c++) {
          const cx = (c * 200) - (camX * 0.2) % 200;
          ctx.fillRect(cx + 20, 40, 36, 12);
          ctx.fillRect(cx + 26, 34, 24, 6);
          ctx.fillRect(cx + 14, 44, 48, 8);
        }
      }

      drawTile(ctx, tile, x, y) {
        switch (tile) {
          case TILE_GROUND:
            ctx.fillStyle = '#c84c0c';
            ctx.fillRect(x, y, 16, 16);
            ctx.fillStyle = '#fcb43a';
            ctx.fillRect(x, y, 16, 2);
            ctx.fillStyle = '#000';
            ctx.fillRect(x + 2, y + 5, 2, 2);
            ctx.fillRect(x + 10, y + 11, 2, 2);
            break;

          case TILE_BRICK:
            ctx.fillStyle = '#b84418';
            ctx.fillRect(x, y, 16, 16);
            ctx.fillStyle = '#000';
            ctx.fillRect(x, y + 7, 16, 1);
            ctx.fillRect(x + 7, y, 1, 7);
            ctx.fillRect(x + 15, y + 8, 1, 8);
            ctx.fillRect(x + 7, y + 8, 1, 8);
            ctx.fillStyle = '#fcb43a';
            ctx.fillRect(x, y, 16, 1);
            break;

          case TILE_Q_COIN:
            ctx.fillStyle = '#fcb43a';
            ctx.fillRect(x, y, 16, 16);
            ctx.fillStyle = '#b84418';
            ctx.fillRect(x + 1, y + 1, 14, 1);
            ctx.fillRect(x + 1, y + 14, 14, 1);
            ctx.fillStyle = '#6b4000';
            ctx.fillRect(x + 5, y + 3, 6, 2);
            ctx.fillRect(x + 9, y + 5, 2, 3);
            ctx.fillRect(x + 7, y + 7, 2, 2);
            ctx.fillRect(x + 7, y + 11, 2, 2);
            break;

          case TILE_COIN:
            ctx.fillStyle = '#fcb43a';
            ctx.fillRect(x + 4, y + 2, 8, 12);
            ctx.fillStyle = '#ffffff';
            ctx.fillRect(x + 6, y + 4, 4, 8);
            break;

          case TILE_EMPTY:
            ctx.fillStyle = '#8c5828';
            ctx.fillRect(x, y, 16, 16);
            ctx.fillStyle = '#583818';
            ctx.fillRect(x + 1, y + 1, 14, 14);
            ctx.fillStyle = '#000';
            ctx.fillRect(x + 2, y + 2, 2, 2);
            ctx.fillRect(x + 12, y + 2, 2, 2);
            ctx.fillRect(x + 2, y + 12, 2, 2);
            ctx.fillRect(x + 12, y + 12, 2, 2);
            break;

          case TILE_PIPE_TL:
            ctx.fillStyle = '#00a800';
            ctx.fillRect(x, y, 16, 16);
            ctx.fillStyle = '#84fc3c';
            ctx.fillRect(x + 2, y, 3, 16);
            ctx.fillStyle = '#005000';
            ctx.fillRect(x + 13, y, 3, 16);
            break;

          case TILE_PIPE_TR:
            ctx.fillStyle = '#00a800';
            ctx.fillRect(x, y, 16, 16);
            ctx.fillStyle = '#005000';
            ctx.fillRect(x + 12, y, 4, 16);
            break;

          case TILE_PIPE_BL:
            ctx.fillStyle = '#00a800';
            ctx.fillRect(x + 2, y, 14, 16);
            ctx.fillStyle = '#84fc3c';
            ctx.fillRect(x + 4, y, 3, 16);
            break;

          case TILE_PIPE_BR:
            ctx.fillStyle = '#00a800';
            ctx.fillRect(x, y, 14, 16);
            ctx.fillStyle = '#005000';
            ctx.fillRect(x + 10, y, 4, 16);
            break;

          case TILE_FLAG_TOP:
            ctx.fillStyle = '#00a800';
            ctx.fillRect(x + 6, y + 4, 4, 4);
            ctx.fillStyle = '#fcb43a';
            ctx.fillRect(x + 7, y + 8, 2, 8);
            break;

          case TILE_FLAG_POLE:
            ctx.fillStyle = '#f8d878';
            ctx.fillRect(x + 7, y, 2, 16);
            break;

          case TILE_CASTLE_BRICK:
            ctx.fillStyle = '#6b6b6b';
            ctx.fillRect(x, y, 16, 16);
            ctx.fillStyle = '#ffffff';
            ctx.fillRect(x, y, 16, 1);
            ctx.fillStyle = '#383838';
            ctx.fillRect(x, y + 8, 16, 1);
            ctx.fillRect(x + 7, y, 1, 8);
            ctx.fillRect(x + 15, y + 8, 1, 8);
            break;

          case TILE_CASTLE_TOP:
            ctx.fillStyle = '#6b6b6b';
            ctx.fillRect(x + 2, y + 4, 12, 12);
            ctx.fillStyle = '#00a800';
            ctx.fillRect(x + 6, y, 4, 4);
            break;

          case TILE_CASTLE_DOOR:
            ctx.fillStyle = '#000000';
            ctx.fillRect(x + 2, y, 12, 16);
            ctx.fillStyle = '#383838';
            ctx.fillRect(x + 4, y + 2, 8, 14);
            break;
        }
      }

      drawFlag(ctx, camX) {
        const fx = Math.round(this.level.flagX - 14 - camX);
        const fy = Math.round(this.flagY);
        ctx.fillStyle = '#00a800';
        ctx.beginPath();
        ctx.moveTo(fx, fy);
        ctx.lineTo(fx + 16, fy + 7);
        ctx.lineTo(fx + 16, fy - 7);
        ctx.closePath();
        ctx.fill();
        ctx.fillStyle = '#fff';
        ctx.fillRect(fx + 8, fy - 2, 3, 3);
      }

      drawHUD(ctx) {
        ctx.fillStyle = '#ffffff';
        ctx.font = '9px monospace';
        ctx.textAlign = 'left';

        ctx.fillText('MARIO', 16, 14);
        ctx.fillText(String(this.score).padStart(6, '0'), 16, 24);

        ctx.fillStyle = '#fcb43a';
        ctx.fillRect(86, 17, 5, 7);
        ctx.fillStyle = '#fff';
        ctx.fillText(`*x${String(this.coins).padStart(2, '0')}`, 95, 24);

        ctx.fillText('WORLD', 145, 14);
        ctx.fillText(' 1-1', 147, 24);

        ctx.fillText('TIME', 205, 14);
        ctx.fillText(String(this.time).padStart(3, '0'), 210, 24);
      }

      loop() {
        this.update();
        this.draw();
        requestAnimationFrame(() => this.loop());
      }
    }

    window.addEventListener('DOMContentLoaded', () => {
      window.game = new MarioGame();
    });
  </script>
</body>
