<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Pocket Monsters - Retro Edition</title>
    <style>
        * { box-sizing: border-box; user-select: none; -webkit-user-select: none; }
        body {
            background-color: #8b956d;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
            font-family: monospace;
            color: #0f380f;
        }
        #game-container {
            background: #9bbc0f;
            border: 8px solid #0f380f;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            width: 320px;
            height: 288px;
            position: relative;
            overflow: hidden;
        }
        canvas {
            display: block;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
        }
        .controls {
            display: flex;
            justify-content: space-between;
            width: 340px;
            margin-top: 15px;
            padding: 0 10px;
        }
        .dpad {
            position: relative;
            width: 110px;
            height: 110px;
        }
        .dpad-btn {
            position: absolute;
            background: #306230;
            border: 2px solid #0f380f;
            color: #9bbc0f;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }
        #btn-up    { top: 0; left: 35px; width: 40px; height: 35px; border-radius: 4px 4px 0 0; }
        #btn-down  { bottom: 0; left: 35px; width: 40px; height: 35px; border-radius: 0 0 4px 4px; }
        #btn-left  { top: 35px; left: 0; width: 35px; height: 40px; border-radius: 4px 0 0 4px; }
        #btn-right { top: 35px; right: 0; width: 35px; height: 40px; border-radius: 0 4px 4px 0; }
        .action-btns {
            display: flex;
            gap: 15px;
            align-items: center;
        }
        .action-btn {
            width: 50px;
            height: 50px;
            background: #8b0000;
            border: 3px solid #0f380f;
            border-radius: 50%;
            color: #fff;
            font-weight: bold;
            font-size: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 0 4px 0 #0f380f;
        }
        .action-btn:active {
            transform: translateY(4px);
            box-shadow: 0 0 0 #0f380f;
        }
        #btn-b { background: #b8860b; }
    </style>
</head>
<body>

<div id="game-container">
    <canvas id="gameCanvas" width="320" height="288"></canvas>
</div>

<div class="controls">
    <div class="dpad">
        <div id="btn-up" class="dpad-btn">▲</div>
        <div id="btn-down" class="dpad-btn">▼</div>
        <div id="btn-left" class="dpad-btn">◀</div>
        <div id="btn-right" class="dpad-btn">▶</div>
    </div>
    <div class="action-btns">
        <div id="btn-b" class="action-btn">B</div>
        <div id="btn-a" class="action-btn">A</div>
    </div>
</div>

<script>
window.G = {};

(function() {
    // 1. G.data
    const TYPES = ['normal', 'fire', 'water', 'grass', 'electric', 'flying', 'ground', 'dark'];
    const CHART = {
        fire:     { grass: 2, water: 0.5, fire: 0.5, rock: 0.5 },
        water:    { fire: 2, grass: 0.5, water: 0.5, ground: 2 },
        grass:    { water: 2, fire: 0.5, grass: 0.5, flying: 0.5, ground: 2 },
        electric: { water: 2, electric: 0.5, ground: 0 },
        flying:   { grass: 2, electric: 0.5 },
        ground:   { fire: 2, electric: 2, grass: 0.5, flying: 0 },
        normal:   {},
        dark:     {}
    };
    const MOVES = {
        tackle:  { name: '撞擊', type: 'normal', power: 40, acc: 100, pp: 35, effect: null },
        ember:   { name: '火花', type: 'fire', power: 40, acc: 100, pp: 25, effect: 'burn' },
        watergun:{ name: '水槍', type: 'water', power: 40, acc: 100, pp: 25, effect: null },
        vinewhip:{ name: '藤鞭', type: 'grass', power: 45, acc: 100, pp: 25, effect: null },
        thunder: { name: '電擊', type: 'electric', power: 40, acc: 100, pp: 25, effect: 'para' },
        gust:    { name: '起風', type: 'flying', power: 40, acc: 100, pp: 35, effect: null },
        sludge:  { name: '暗影', type: 'dark', power: 50, acc: 90, pp: 15, effect: null },
        heal:    { name: '自我再生', type: 'normal', power: 0, acc: 100, pp: 10, effect: 'heal' }
    };
    const SPECIES = [
        { id: 1, name: '草苗龜', emoji: '🌱', types: ['grass'], base: {hp:45, atk:49, def:49, spd:45}, moves: ['tackle','vinewhip'], evolve: {lv: 16, to: 2}, catchRate: 255 },
        { id: 2, name: '草苗獸', emoji: '🌿', types: ['grass'], base: {hp:60, atk:62, def:63, spd:60}, moves: ['tackle','vinewhip','heal'], evolve: null, catchRate: 120 },
        { id: 3, name: '火小狐', emoji: '🔥', types: ['fire'], base: {hp:39, atk:52, def:43, spd:65}, moves: ['tackle','ember'], evolve: {lv: 16, to: 4}, catchRate: 255 },
        { id: 4, name: '烈火狐', emoji: '🦊', types: ['fire'], base: {hp:58, atk:64, def:58, spd:80}, moves: ['tackle','ember','heal'], evolve: null, catchRate: 120 },
        { id: 5, name: '水滴球', emoji: '💧', types: ['water'], base: {hp:44, atk:48, def:65, spd:43}, moves: ['tackle','watergun'], evolve: {lv: 16, to: 6}, catchRate: 255 },
        { id: 6, name: '巨浪獸', emoji: '🌊', types: ['water'], base: {hp:59, atk:63, def:80, spd:58}, moves: ['tackle','watergun','heal'], evolve: null, catchRate: 120 },
        { id: 7, name: '皮卡鼠', emoji: '⚡', types: ['electric'], base: {hp:35, atk:55, def:40, spd:90}, moves: ['tackle','thunder'], evolve: null, catchRate: 190 },
        { id: 8, name: '波波鳥', emoji: '🐦', types: ['flying','normal'], base: {hp:40, atk:45, def:40, spd:56}, moves: ['tackle','gust'], evolve: null, catchRate: 255 },
        { id: 9, name: '地鼠王', emoji: '🐹', types: ['ground'], base: {hp:50, atk:75, def:85, spd:40}, moves: ['tackle'], evolve: null, catchRate: 255 },
        { id: 10, name: '暗影蝠', emoji: '🦇', types: ['dark','flying'], base: {hp:45, atk:55, def:40, spd:70}, moves: ['tackle','sludge'], evolve: null, catchRate: 190 },
        { id: 11, name: '館主之鷹', emoji: '🦅', types: ['flying'], base: {hp:70, atk:85, def:70, spd:95}, moves: ['gust','tackle'], evolve: null, catchRate: 50 },
        { id: 12, name: '館主之岩', emoji: '🗿', types: ['ground'], base: {hp:80, atk:90, def:100, spd:40}, moves: ['tackle','sludge'], evolve: null, catchRate: 50 }
    ];
    G.data = { TYPES, CHART, MOVES, SPECIES };

    // 2. G.mon
    function make(sid, lv) {
        const spec = SPECIES.find(s => s.id === sid) || SPECIES[0];
        const maxHp = Math.floor((spec.base.hp * 2 * lv) / 100) + lv + 10;
        const atk = Math.floor((spec.base.atk * 2 * lv) / 100) + 5;
        const def = Math.floor((spec.base.def * 2 * lv) / 100) + 5;
        const spd = Math.floor((spec.base.spd * 2 * lv) / 100) + 5;
        const moves = spec.moves.map(mKey => {
            const m = MOVES[mKey];
            return { key: mKey, name: m.name, type: m.type, power: m.power, acc: m.acc, pp: m.pp, maxPp: m.pp, effect: m.effect };
        });
        return {
            sid: spec.id, name: spec.name, emoji: spec.emoji, types: [...spec.types],
            level: lv, exp: lv * lv * lv, maxExp: (lv+1)*(lv+1)*(lv+1),
            stats: { hp: maxHp, maxHp, atk, def, spd },
            hp: maxHp, maxHp, moves, status: null,
            evolve: spec.evolve ? {...spec.evolve} : null, catchRate: spec.catchRate
        };
    }
    function gainExp(mon, n) {
        mon.exp += n;
        let levelUps = 0;
        let evolved = false;
        while (mon.exp >= mon.maxExp && mon.level < 100) {
            mon.level++;
            levelUps++;
            mon.maxExp = (mon.level + 1) * (mon.level + 1) * (mon.level + 1);
            mon.stats.maxHp = Math.floor((SPECIES.find(s=>s.id===mon.sid).base.hp * 2 * mon.level)/100) + mon.level + 10;
            mon.hp = mon.stats.maxHp;
            if (mon.evolve && mon.level >= mon.evolve.lv) {
                const nextSpec = SPECIES.find(s => s.id === mon.evolve.to);
                if (nextSpec) {
                    mon.sid = nextSpec.id;
                    mon.name = nextSpec.name;
                    mon.emoji = nextSpec.emoji;
                    mon.types = [...nextSpec.types];
                    mon.evolve = nextSpec.evolve ? {...nextSpec.evolve} : null;
                    evolved = true;
                }
            }
        }
        return { levelUps, evolved };
    }
    G.mon = { make, gainExp };

    // 3 & 4. G.battle
    function newBattle(playerParty, enemyParty, options = {}) {
        return {
            playerParty, enemyParty,
            playerIndex: 0, enemyIndex: 0,
            activePlayer: playerParty[0], activeEnemy: enemyParty[0],
            wild: options.wild !== false,
            turn: 1, ended: false, winner: null, log: [],
            items: { ball: 5, potion: 3 }
        };
    }
    function calcDamage(attacker, defender, move) {
        if (move.power === 0) return 0;
        let atk = attacker.stats.atk;
        let def = defender.stats.def;
        let base = Math.floor(Math.floor((Math.floor((2 * attacker.level) / 5 + 2) * move.power * atk) / def) / 50) + 2;
        let stab = attacker.types.includes(move.type) ? 1.5 : 1.0;
        let typeMod = 1.0;
        defender.types.forEach(dt => {
            if (CHART[move.type] && CHART[move.type][dt] !== undefined) {
                typeMod *= CHART[move.type][dt];
            }
        });
        let crit = Math.random() < (1/16) ? 1.5 : 1.0;
        let rand = (Math.floor(Math.random() * 16) + 85) / 100;
        let dmg = Math.floor(base * stab * typeMod * crit * rand);
        return Math.max(1, dmg);
    }
    function act(state, action) {
        let events = [];
        if (state.ended) return events;
        let pMon = state.activePlayer;
        let eMon = state.activeEnemy;

        if (action.type === 'run') {
            if (!state.wild) {
                events.push({ type: 'text', msg: '無法從訓練家對戰中逃跑！' });
                return events;
            }
            events.push({ type: 'text', msg: '成功逃跑了！' });
            state.ended = true; state.winner = 'enemy';
            return events;
        }
        if (action.type === 'ball') {
            if (!state.wild) {
                events.push({ type: 'text', msg: '不能偷走訓練家的精靈！' });
                return events;
            }
            if (state.items.ball <= 0) {
                events.push({ type: 'text', msg: '沒有捕捉球了！' });
                return events;
            }
            state.items.ball--;
            events.push({ type: 'text', msg: `使用了捕捉球！(${eMon.name})` });
            let hpFactor = (3 * eMon.stats.maxHp - 2 * eMon.hp) / (3 * eMon.stats.maxHp);
            let catchProb = (eMon.catchRate / 255) * hpFactor;
            if (Math.random() < catchProb) {
                events.push({ type: 'text', msg: `太棒了！成功捕捉 ${eMon.name}！` });
                state.playerParty.push(eMon);
                state.ended = true; state.winner = 'player';
            } else {
                events.push({ type: 'text', msg: `可惡！差一點就抓到了！` });
            }
            if (!state.ended) enemyTurn(state, events);
            return events;
        }
        if (action.type === 'item') {
            if (action.item === 'potion') {
                if (state.items.potion <= 0) {
                    events.push({ type: 'text', msg: '沒有傷藥了！' });
                    return events;
                }
                state.items.potion--;
                pMon.hp = Math.min(pMon.stats.maxHp, pMon.hp + 50);
                events.push({ type: 'text', msg: `使用了傷藥，${pMon.name} 恢復了 50 HP！` });
            }
            enemyTurn(state, events);
            return events;
        }
        if (action.type === 'switch') {
            let nextP = state.playerParty[action.index];
            if (!nextP || nextP.hp <= 0) {
                events.push({ type: 'text', msg: '該精靈無法戰鬥！' });
                return events;
            }
            state.playerIndex = action.index;
            state.activePlayer = nextP;
            events.push({ type: 'text', msg: `回來吧！換上 ${nextP.name}！` });
            enemyTurn(state, events);
            return events;
        }
        if (action.type === 'move') {
            let pMove = pMon.moves[action.index];
            if (!pMove || pMove.pp <= 0) {
                events.push({ type: 'text', msg: 'PP 不足或招式不存在！' });
                return events;
            }
            pMove.pp--;
            let eMove = eMon.moves[Math.floor(Math.random() * eMon.moves.length)];
            let pFirst = pMon.stats.spd >= eMon.stats.spd;

            function executePlayer(evs) {
                if (pMon.hp <= 0 || state.ended) return;
                evs.push({ type: 'text', msg: `${pMon.name} 使用了 ${pMove.name}！` });
                if (pMove.effect === 'heal') {
                    let healAmt = Math.floor(pMon.stats.maxHp / 2);
                    pMon.hp = Math.min(pMon.stats.maxHp, pMon.hp + healAmt);
                    evs.push({ type: 'text', msg: `${pMon.name} 回復了體力！` });
                } else {
                    let dmg = calcDamage(pMon, eMon, pMove);
                    eMon.hp = Math.max(0, eMon.hp - dmg);
                    evs.push({ type: 'damage', target: 'enemy', value: dmg });
                    if (eMon.hp <= 0) {
                        evs.push({ type: 'text', msg: `敵方 ${eMon.name} 倒下了！` });
                        let nextEnemyIdx = state.enemyParty.findIndex(m => m.hp > 0);
                        if (nextEnemyIdx !== -1) {
                            state.enemyIndex = nextEnemyIdx;
                            state.activeEnemy = state.enemyParty[nextEnemyIdx];
                            evs.push({ type: 'text', msg: `對手派出了 ${state.activeEnemy.name}！` });
                        } else {
                            state.ended = true; state.winner = 'player';
                        }
                    }
                }
            }

            function executeEnemy(evs) {
                if (state.ended || eMon.hp <= 0 || pMon.hp <= 0) return;
                evs.push({ type: 'text', msg: `敵方 ${eMon.name} 使用了 ${eMove.name}！` });
                let dmg = calcDamage(eMon, pMon, eMove);
                pMon.hp = Math.max(0, pMon.hp - dmg);
                evs.push({ type: 'damage', target: 'player', value: dmg });
                if (pMon.hp <= 0) {
                    evs.push({ type: 'text', msg: `${pMon.name} 倒下了！` });
                    let alive = state.playerParty.some(m => m.hp > 0);
                    if (!alive) {
                        state.ended = true; state.winner = 'enemy';
                        evs.push({ type: 'text', msg: '我方全體精靈失去戰鬥能力！' });
                    }
                }
            }

            if (pFirst) {
                executePlayer(events);
                if (!state.ended) executeEnemy(events);
            } else {
                executeEnemy(events);
                if (!state.ended) executePlayer(events);
            }
        }
        return events;
    }
    function enemyTurn(state, evs) {
        let eMon = state.activeEnemy;
        let pMon = state.activePlayer;
        if (state.ended || pMon.hp <= 0) return;
        let eMove = eMon.moves[Math.floor(Math.random() * eMon.moves.length)];
        evs.push({ type: 'text', msg: `敵方 ${eMon.name} 使用了 ${eMove.name}！` });
        let dmg = calcDamage(eMon, pMon, eMove);
        pMon.hp = Math.max(0, pMon.hp - dmg);
        evs.push({ type: 'damage', target: 'player', value: dmg });
        if (pMon.hp <= 0) {
            evs.push({ type: 'text', msg: `${pMon.name} 倒下了！` });
            let alive = state.playerParty.some(m => m.hp > 0);
            if (!alive) {
                state.ended = true; state.winner = 'enemy';
                evs.push({ type: 'text', msg: '我方全體精靈失去戰鬥能力！' });
            }
        }
    }
    G.battle = { newBattle, act };

    // 5. G.input & G.world
    const keys = { up: false, down: false, left: false, right: false, a: false, b: false };
    function bindInput() {
        const mapKey = (k, isDown) => {
            if (k === 'ArrowUp' || k === 'KeyW') keys.up = isDown;
            if (k === 'ArrowDown' || k === 'KeyS') keys.down = isDown;
            if (k === 'ArrowLeft' || k === 'KeyA') keys.left = isDown;
            if (k === 'ArrowRight' || k === 'KeyD') keys.right = isDown;
            if (k === 'KeyZ' || k === 'Space' || k === 'Enter') keys.a = isDown;
            if (k === 'KeyX' || k === 'ShiftLeft') keys.b = isDown;
        };
        window.addEventListener('keydown', e => mapKey(e.code, true));
        window.addEventListener('keyup', e => mapKey(e.code, false));

        const bindBtn = (id, keyName) => {
            const el = document.getElementById(id);
            if (!el) return;
            el.addEventListener('touchstart', e => { e.preventDefault(); keys[keyName] = true; });
            el.addEventListener('touchend', e => { e.preventDefault(); keys[keyName] = false; });
            el.addEventListener('mousedown', e => { keys[keyName] = true; });
            el.addEventListener('mouseup', e => { keys[keyName] = false; });
        };
        bindBtn('btn-up', 'up');
        bindBtn('btn-down', 'down');
        bindBtn('btn-left', 'left');
        bindBtn('btn-right', 'right');
        bindBtn('btn-a', 'a');
        bindBtn('btn-b', 'b');
    }
    G.input = { keys, bindInput };

    // World Map: 20x20. 0: road, 1: wall, 2: tall grass, 3: gym
    let mapData = [];
    let playerPos = { x: 10, y: 10, dir: 'down' };
    let gymLeaderPos = { x: 10, y: 4 };

    function initWorld() {
        mapData = [];
        for (let y = 0; y < 20; y++) {
            let row = [];
            for (let x = 0; x < 20; x++) {
                if (x === 0 || x === 19 || y === 0 || y === 19) row.push(1);
                else if (x >= 8 && x <= 12 && y >= 3 && y <= 6) row.push(3); // Gym area
                else if ((x >= 2 && x <= 6) || (x >= 14 && x <= 17)) row.push(2); // Grass
                else row.push(0);
            }
            row[4] = 3; // Gym door
            mapData[y] = row;
        }
        playerPos = { x: 10, y: 10, dir: 'down' };
    }
    G.world = { 
        get map() { return mapData; }, 
        get player() { return playerPos; }, 
        get gymLeader() { return gymLeaderPos; },
        initWorld,
        movePlayer(dx, dy) {
            let nx = playerPos.x + dx;
            let ny = playerPos.y + dy;
            if (dx > 0) playerPos.dir = 'right';
            if (dx < 0) playerPos.dir = 'left';
            if (dy > 0) playerPos.dir = 'down';
            if (dy < 0) playerPos.dir = 'up';

            if (nx >= 0 && nx < 20 && ny >= 0 && ny < 20) {
                if (mapData[ny][nx] !== 1) {
                    playerPos.x = nx;
                    playerPos.y = ny;
                    return mapData[ny][nx] === 2; // in grass
                }
            }
            return false;
        }
    };

    // 6. G.ui
    function render(ctx, state, subState) {
        ctx.fillStyle = '#9bbc0f';
        ctx.fillRect(0, 0, 320, 288);

        if (state === 'TITLE') {
            ctx.fillStyle = '#0f380f';
            ctx.font = 'bold 20px monospace';
            ctx.fillText('POCKET MONSTERS', 40, 80);
            ctx.font = '12px monospace';
            ctx.fillText('- RETRO EDITION -', 90, 110);
            ctx.fillText('PRESS A TO START', 90, 180);
            ctx.fillText('© 2026 BUILDER', 100, 240);
        } else if (state === 'CHOICE') {
            ctx.fillStyle = '#0f380f';
            ctx.fillRect(15, 30, 290, 228);
            ctx.strokeStyle = '#9bbc0f';
            ctx.strokeRect(15, 30, 290, 228);
            ctx.fillStyle = '#9bbc0f';
            ctx.font = '12px monospace';
            ctx.fillText('選擇你的第一隻精靈：', 30, 60);
            let choices = [
                { name: '草苗龜', emoji: '🌱', type: '草' },
                { name: '火小狐', emoji: '🔥', type: '火' },
                { name: '水滴球', emoji: '💧', type: '水' }
            ];
            choices.forEach((c, idx) => {
                let selected = subState.cursor === idx;
                ctx.fillText(`${selected ? '▶' : ' '} ${idx+1}. ${c.emoji} ${c.name} (${c.type})`, 40, 100 + idx * 35);
            });
            ctx.fillText('使用方向鍵選擇，按 A 確定', 30, 220);
        } else if (state === 'OVERWORLD') {
            let m = G.world.map;
            let p = G.world.player;
            let startX = Math.max(0, Math.min(10, p.x - 5));
            let startY = Math.max(0, Math.min(10, p.y - 5));

            for (let y = 0; y < 10; y++) {
                for (let x = 0; x < 10; x++) {
                    let mapX = startX + x;
                    let mapY = startY + y;
                    let tile = m[mapY] ? m[mapY][mapX] : 1;
                    ctx.fillStyle = tile === 1 ? '#306230' : (tile === 2 ? '#8bac0f' : (tile === 3 ? '#4876ff' : '#9bbc0f'));
                    ctx.fillRect(x * 32, y * 32, 32, 32);
                    ctx.strokeStyle = '#8b956d';
                    ctx.strokeRect(x * 32, y * 32, 32, 32);
                }
            }
            let gl = G.world.gymLeader;
            if (gl.x >= startX && gl.x < startX + 10 && gl.y >= startY && gl.y < startY + 10) {
                ctx.font = '20px monospace';
                ctx.fillText('🧑‍✈️', (gl.x - startX) * 32 + 6, (gl.y - startY) * 32 + 24);
            }
            ctx.font = '20px monospace';
            ctx.fillText('🧍', (p.x - startX) * 32 + 6, (p.y - startY) * 32 + 24);

            ctx.fillStyle = '#0f380f';
            ctx.fillRect(0, 256, 320, 32);
            ctx.fillStyle = '#9bbc0f';
            ctx.font = '12px monospace';
            ctx.fillText(`Pos:(${p.x},${p.y})  Badges:${(window.gameBadges||[]).length}`, 10, 276);
        } else if (state === 'BATTLE') {
            let b = subState.battle;
            let p = b.activePlayer;
            let e = b.activeEnemy;

            // Enemy Box
            ctx.fillStyle = '#306230';
            ctx.fillRect(10, 10, 140, 50);
            ctx.fillStyle = '#9bbc0f';
            ctx.font = '10px monospace';
            ctx.fillText(`${e.name} Lv${e.level}`, 15, 25);
            ctx.fillText(`HP: ${e.hp}/${e.stats.maxHp}`, 15, 45);
            ctx.font = '24px monospace';
            ctx.fillText(e.emoji, 180, 50);

            // Player Box
            ctx.fillStyle = '#306230';
            ctx.fillRect(170, 130, 140, 60);
            ctx.fillStyle = '#9bbc0f';
            ctx.font = '10px monospace';
            ctx.fillText(`${p.name} Lv${p.level}`, 175, 145);
            ctx.fillText(`HP: ${p.hp}/${p.stats.maxHp}`, 175, 165);
            ctx.font = '24px monospace';
            ctx.fillText(p.emoji, 120, 160);

            // Menu box
            ctx.fillStyle = '#0f380f';
            ctx.fillRect(0, 200, 320, 88);
            ctx.fillStyle = '#9bbc0f';
            if (subState.menuMode === 'main') {
                ctx.fillText(`${subState.cursor === 0 ? '▶' : ' '} 1. 攻擊    ${subState.cursor === 1 ? '▶' : ' '} 2. 背包`, 20, 230);
                ctx.fillText(`${subState.cursor === 2 ? '▶' : ' '} 3. 更換    ${subState.cursor === 3 ? '▶' : ' '} 4. 逃跑`, 20, 255);
            } else if (subState.menuMode === 'moves') {
                p.moves.forEach((m, idx) => {
                    ctx.fillText(`${idx === subState.cursor ? '▶' : ' '} ${m.name} (PP:${m.pp}/${m.maxPp})`, 20 + (idx%2)*150, 230 + Math.floor(idx/2)*25);
                });
            } else if (subState.menuMode === 'items') {
                ctx.fillText(`▶ 1. 捕捉球 x${b.items.ball}  2. 傷藥 x${b.items.potion}`, 20, 230);
                ctx.fillText('   (按 A 使用，B 返回)', 20, 255);
            } else if (subState.menuMode === 'switch') {
                subState.battle.playerParty.forEach((mp, idx) => {
                    ctx.fillText(`${idx === subState.cursor ? '▶' : ' '} ${mp.name} HP:${mp.hp}/${mp.stats.maxHp}`, 20, 215 + idx * 20);
                });
            }
        } else if (state === 'DIALOG' || state === 'CHOICE') {
            ctx.fillStyle = '#0f380f';
            ctx.fillRect(10, 180, 300, 98);
            ctx.strokeStyle = '#9bbc0f';
            ctx.lineWidth = 2;
            ctx.strokeRect(10, 180, 300, 98);
            ctx.fillStyle = '#9bbc0f';
            ctx.font = '12px monospace';
            let lines = subState.text.match(/.{1,22}/g) || [subState.text];
            lines.slice(0, 4).forEach((l, i) => {
                ctx.fillText(l, 25, 205 + i * 20);
            });
        }
    }
    G.ui = { render };

    // 7. G.save
    const SAVE_KEY = 'pkm_save_v1';
    function save(data) {
        localStorage.setItem(SAVE_KEY, JSON.stringify(data));
    }
    function load() {
        try {
            let raw = localStorage.getItem(SAVE_KEY);
            if (!raw) return null;
            return JSON.parse(raw);
        } catch(e) {
            return null;
        }
    }
    function getDefaultSave() {
        return {
            party: [],
            badges: [],
            pos: { x: 10, y: 10 }
        };
    }
    G.save = { save, load, getDefaultSave };

    // 8. Main Game Loop & Integration State Machine
    let canvas, ctx;
    let gameState = 'TITLE'; // TITLE, OVERWORLD, BATTLE, DIALOG, CHOICE
    let subState = { text: '', menuMode: 'main', cursor: 0, battle: null };
    let playerParty = [];
    let gameBadges = [];

    window.addEventListener('load', () => {
        canvas = document.getElementById('gameCanvas');
        ctx = canvas.getContext('2d');
        G.input.bindInput();

        let saved = G.save.load();
        if (saved && saved.party && saved.party.length > 0) {
            playerParty = saved.party;
            gameBadges = saved.badges || [];
            window.gameBadges = gameBadges;
        } else {
            playerParty = [];
            gameBadges = [];
            window.gameBadges = gameBadges;
        }

        requestAnimationFrame(gameLoop);
    });

    let lastKeyA = false;
    let lastKeyB = false;
    let lastSetUp = false;
    let lastSetDown = false;
    let lastSetLeft = false;
    let lastSetRight = false;

    function gameLoop() {
        let aPressed = G.input.keys.a && !lastKeyA;
        let bPressed = G.input.keys.b && !lastKeyB;
        let upPressed = G.input.keys.up && !lastSetUp;
        let downPressed = G.input.keys.down && !lastSetDown;
        let leftPressed = G.input.keys.left && !lastSetLeft;
        let rightPressed = G.input.keys.right && !lastSetRight;

        lastKeyA = G.input.keys.a;
        lastKeyB = G.input.keys.b;
        lastSetUp = G.input.keys.up;
        lastSetDown = G.input.keys.down;
        lastSetLeft = G.input.keys.left;
        lastSetRight = G.input.keys.right;

        if (gameState === 'TITLE') {
            if (aPressed) {
                if (playerParty.length === 0) {
                    gameState = 'CHOICE';
                    subState = { cursor: 0 };
                } else {
                    G.world.initWorld();
                    gameState = 'OVERWORLD';
                }
            }
        } else if (gameState === 'CHOICE') {
            if (upPressed) subState.cursor = Math.max(0, subState.cursor - 1);
            if (downPressed) subState.cursor = Math.min(2, subState.cursor + 1);
            if (aPressed) {
                let sid = [1, 3, 5][subState.cursor];
                playerParty = [G.mon.make(sid, 5)];
                G.save.save({ party: playerParty, badges: [], pos: {x:10, y:10} });
                G.world.initWorld();
                gameState = 'OVERWORLD';
            }
        } else if (gameState === 'OVERWORLD') {
            let dx = 0, dy = 0;
            if (G.input.keys.up) dy = -1;
            else if (G.input.keys.down) dy = 1;
            else if (G.input.keys.left) dx = -1;
            else if (G.input.keys.right) dx = 1;

            if (dx !== 0 || dy !== 0) {
                if (upPressed || downPressed || leftPressed || rightPressed) {
                    let inGrass = G.world.movePlayer(dx, dy);
                    let p = G.world.player;
                    let gl = G.world.gymLeader;
                    if (p.x === gl.x && (p.y === gl.y + 1 || p.y === gl.y - 1)) {
                        let gymEnemy1 = G.mon.make(11, 12);
                        let gymEnemy2 = G.mon.make(12, 12);
                        subState.battle = G.battle.newBattle(playerParty, [gymEnemy1, gymEnemy2], { wild: false });
                        gameState = 'BATTLE';
                        subState.menuMode = 'main';
                        subState.cursor = 0;
                    } else if (inGrass && Math.random() < 0.25) {
                        let wildSid = [1,3,5,7,8,9,10][Math.floor(Math.random()*7)];
                        let wildLv = Math.floor(Math.random() * 3) + 3;
                        subState.battle = G.battle.newBattle(playerParty, [G.mon.make(wildSid, wildLv)], { wild: true });
                        gameState = 'BATTLE';
                        subState.menuMode = 'main';
                        subState.cursor = 0;
                    }
                }
            }
            if (aPressed) {
                let p = G.world.player;
                let gl = G.world.gymLeader;
                let frontX = p.x + (p.dir === 'left' ? -1 : (p.dir === 'right' ? 1 : 0));
                let frontY = p.y + (p.dir === 'up' ? -1 : (p.dir === 'down' ? 1 : 0));
                if (frontX === gl.x && frontY === gl.y) {
                    let gymEnemy1 = G.mon.make(11, 12);
                    let gymEnemy2 = G.mon.make(12, 12);
                    subState.battle = G.battle.newBattle(playerParty, [gymEnemy1, gymEnemy2], { wild: false });
                    gameState = 'BATTLE';
                    subState.menuMode = 'main';
                    subState.cursor = 0;
                }
            }
        } else if (gameState === 'BATTLE') {
            let b = subState.battle;
            if (subState.menuMode === 'main') {
                if (upPressed) subState.cursor = (subState.cursor < 2) ? subState.cursor + 2 : subState.cursor - 2;
                if (downPressed) subState.cursor = (subState.cursor >= 2) ? subState.cursor - 2 : subState.cursor + 2;
                if (leftPressed || rightPressed) subState.cursor = subState.cursor % 2 === 0 ? subState.cursor + 1 : subState.cursor - 1;
                subState.cursor = Math.max(0, Math.min(3, subState.cursor));

                if (aPressed) {
                    if (subState.cursor === 0) { subState.menuMode = 'moves'; subState.cursor = 0; }
                    else if (subState.cursor === 1) { subState.menuMode = 'items'; subState.cursor = 0; }
                    else if (subState.cursor === 2) { subState.menuMode = 'switch'; subState.cursor = 0; }
                    else if (subState.cursor === 3) {
                        let evs = G.battle.act(b, { type: 'run' });
                        triggerEvents(evs, b);
                    }
                }
            } else if (subState.menuMode === 'moves') {
                let pMon = b.activePlayer;
                let maxMoves = pMon.moves.length;
                if (upPressed || downPressed) {
                    if (maxMoves > 2) subState.cursor = (subState.cursor < 2) ? Math.min(maxMoves - 1, subState.cursor + 2) : subState.cursor - 2;
                }
                if (leftPressed || rightPressed) {
                    if (maxMoves > 1) subState.cursor = subState.cursor % 2 === 0 ? Math.min(maxMoves - 1, subState.cursor + 1) : subState.cursor - 1;
                }
                subState.cursor = Math.max(0, Math.min(maxMoves - 1, subState.cursor));

                if (aPressed) {
                    let evs = G.battle.act(b, { type: 'move', index: subState.cursor });
                    triggerEvents(evs, b);
                }
                if (bPressed) { subState.menuMode = 'main'; subState.cursor = 0; }
            } else if (subState.menuMode === 'items') {
                if (upPressed || downPressed) subState.cursor = subState.cursor === 0 ? 1 : 0;
                if (aPressed) {
                    let actType = subState.cursor === 0 ? 'ball' : 'item';
                    let action = actType === 'ball' ? { type: 'ball' } : { type: 'item', item: 'potion' };
                    let evs = G.battle.act(b, action);
                    triggerEvents(evs, b);
                }
                if (bPressed) { subState.menuMode = 'main'; subState.cursor = 0; }
            } else if (subState.menuMode === 'switch') {
                let party = b.playerParty;
                if (upPressed) subState.cursor = Math.max(0, subState.cursor - 1);
                if (downPressed) subState.cursor = Math.min(party.length - 1, subState.cursor + 1);
                if (aPressed) {
                    let evs = G.battle.act(b, { type: 'switch', index: subState.cursor });
                    triggerEvents(evs, b);
                }
                if (bPressed) { subState.menuMode = 'main'; subState.cursor = 0; }
            }
        } else if (gameState === 'DIALOG') {
            if (aPressed || bPressed) {
                if (subState.nextState) {
                    gameState = subState.nextState;
                    if (gameState === 'OVERWORLD' && subState.healOnReturn) {
                        playerParty.forEach(m => m.hp = m.stats.maxHp);
                        G.world.initWorld();
                    }
                } else {
                    gameState = 'OVERWORLD';
                }
            }
        }

        G.ui.render(ctx, gameState, subState);

        requestAnimationFrame(gameLoop);
    }

    function triggerEvents(evs, battle) {
        if (evs.length > 0) {
            let msg = evs.map(e => e.msg).filter(Boolean).join('\n');
            let nextSt = 'OVERWORLD';
            let heal = false;

            if (battle.ended) {
                if (battle.winner === 'player') {
                    if (!battle.wild) {
                        if (!gameBadges.includes(1)) gameBadges.push(1);
                        msg += '\n獲得了道館徽章！';
                    } else {
                        msg += '\n戰鬥勝利！獲得經驗值。';
                        playerParty.forEach(m => G.mon.gainExp(m, 30));
                    }
                } else {
                    msg += '\n全體精靈失去戰鬥能力...\n被送回安全處！';
                    heal = true;
                }
                G.save.save({ party: playerParty, badges: gameBadges, pos: {x:10, y:10} });
            }

            gameState = 'DIALOG';
            subState = { text: msg, nextState: nextSt, healOnReturn: heal };
        } else {
            subState.menuMode = 'main';
            subState.cursor = 0;
        }
    }
})();
</script>

</body>
